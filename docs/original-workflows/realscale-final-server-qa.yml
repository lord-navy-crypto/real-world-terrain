name: RealScale Final Battle actual NeoForge dedicated server smoke
on:
  push:
    branches: [qa/realscale-final-battle-20261011]
    paths: ['.github/workflows/realscale-final-server-qa.yml', 'qa/realscale-final/check_actual_chunk_heights.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neoforge-worldgen:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and extract exact final source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,tarfile
          raw=base64.b64decode(Path('qa/realscale-final/project.tar.xz.b64').read_text().strip())
          assert hashlib.sha256(raw).hexdigest()=='c025c04397a54aecc17eb0ae89682bd2afe225acad7518a1ded2483d0a4e34f9'
          out=Path('qa/realscale-final/build-project');out.mkdir(parents=True,exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:xz') as tar:tar.extractall(out,filter='data')
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare EULA and actual world type
        working-directory: qa/realscale-final/build-project
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=world
          level-type=realscale:usgs_big_sur
          level-seed=785312
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          PROPERTIES
          done
      - name: Start actual NeoForge server; verify mod registry and new world
        working-directory: qa/realscale-final/build-project
        run: |
          python3 - <<'PY'
          import subprocess,threading,time,os,signal,json,pathlib,re
          log=pathlib.Path('build/neoforge-server-smoke.log')
          log.parent.mkdir(exist_ok=True,parents=True)
          p=subprocess.Popen(['gradle','--no-daemon','runServer','--stacktrace'],stdin=subprocess.PIPE,
                             stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1,
                             start_new_session=True)
          out=[];done=threading.Event()
          def reader():
            for line in p.stdout:
              out.append(line)
              if 'Done (' in line and 'For help' in line:done.set()
          t=threading.Thread(target=reader,daemon=True);t.start()
          deadline=time.time()+480
          while time.time()<deadline and p.poll() is None and not done.is_set():time.sleep(1)
          if done.is_set():
            print('NEOFORGE_SERVER_BOOT_OK: reached Done milestone')
            time.sleep(18)
          else:
            print('NEOFORGE_SERVER_BOOT_FAIL:',p.poll())
          try:
            if p.poll() is None:
              p.stdin.write('stop\n');p.stdin.flush()
              p.wait(timeout=45)
          except Exception:
            if p.poll() is None:
              os.killpg(p.pid,signal.SIGINT)
              try:p.wait(timeout=15)
              except subprocess.TimeoutExpired:
                os.killpg(p.pid,signal.SIGKILL);p.wait()
          t.join(timeout=2)
          log.write_text(''.join(out))
          text=log.read_text()
          print('SERVER_LOG_TAIL:',text[-5500:])
          print('NeoForge Done marker:',done.is_set(),'lines:',len(out))
          files=list(pathlib.Path('run').glob('**/level.dat'))
          print('Level DAT candidates:',[str(x) for x in files])
          valid=False
          import gzip
          for f in files:
            try:
              data=gzip.decompress(f.read_bytes())
              if b'realscale:usgs_big_sur' in data:
                valid=True;print('Correct generator in saved level.dat:',f)
              else:print('WARNING generated other preset',f)
            except Exception as e:print('Could not read level.dat',f,e)
          if not done.is_set() or not valid:
            raise SystemExit('NeoForge new-world smoke NOT VERIFIED')
          print('GAME ENGINE WORLDGEN SMOKE: PASS')
          PY
      - name: Verify ACTUAL Anvil block heights match USGS sampled terrain
        working-directory: qa/realscale-final/build-project
        run: python3 ../check_actual_chunk_heights.py .
      - name: Upload server diagnostics and generated world metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RealScale-FinalBattle-Actual-NeoForge-Server-QA
          path: |
            qa/realscale-final/build-project/real_dem_anvil_qa.json
            qa/realscale-final/build-project/build/neoforge-server-smoke.log
            qa/realscale-final/build-project/run/**/level.dat
            qa/realscale-final/build-project/run/**/region/*.mca
            qa/realscale-final/build-project/run/**/logs/latest.log
          if-no-files-found: warn
