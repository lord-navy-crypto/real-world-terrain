name: RealScale USGS 3DEP actual terrain point grid
on:
  push:
    branches: [qa/realscale-real-data-pilot-20261011]
    paths: ['.github/workflows/realscale-usgs-region-grid.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  usgs-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Query 12x12 real USGS 3DEP elevations, preserving each response
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,concurrent.futures,pathlib,time,statistics
          out=pathlib.Path('usgs_real_data');out.mkdir(exist_ok=True)
          n=12;lat_center=36.3000;lon_center=-121.7000;d=.0006
          lat_north=lat_center+n*d/2;lon_west=lon_center-n*d/2
          jobs=[(row,col,round(lon_west+(col+.5)*d,7),round(lat_north-(row+.5)*d,7))
                for row in range(n) for col in range(n)]
          def fetch(job):
            row,col,lon,lat=job
            url='https://epqs.nationalmap.gov/v1/json?'+urllib.parse.urlencode(
                {'x':lon,'y':lat,'units':'Meters','wkid':4326,'includeDate':'false'})
            for attempt in range(4):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'RealScaleTerrainScientificResearch/1.0'})
                with urllib.request.urlopen(req,timeout=25) as r:raw=r.read(4000)
                d=json.loads(raw)
                y=float(d.get('value','NaN'))
                if not (-10000<y<10000):raise ValueError('Invalid official elevation: '+str(d))
                return {'row':row,'col':col,'lon':lon,'lat':lat,'elevation_m':y,
                        'raw_sha256':hashlib.sha256(raw).hexdigest(),'response':d,'request_url':url}
              except Exception as e:
                if attempt==3:raise
                time.sleep((attempt+1)*.8)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
            pts=list(ex.map(fetch,jobs))
          pts.sort(key=lambda p:(p['row'],p['col']))
          vals=[x['elevation_m'] for x in pts]
          with (out/'USGS_3DEP_EPQS_12x12_ASCII_EPSG4326.asc').open('w') as f:
            f.write(f'ncols {n}\nnrows {n}\nxllcorner {lon_west:.9f}\nyllcorner {lat_center-n*d/2:.9f}\ncellsize {d:.9f}\nNODATA_value -9999\n')
            for row in range(n):
              f.write(' '.join(f'{p["elevation_m"]:.6f}' for p in pts[row*n:(row+1)*n])+'\n')
          (out/'USGS_3DEP_EPQS_raw_records.json').write_text(json.dumps(pts,indent=2)+'\n')
          profile={'origin':'USGS 3DEP EPQS (interpolated service, not survey point)',
                   'endpoint':'https://epqs.nationalmap.gov/v1/json',
                   'location_center_lat_lon':[lat_center,lon_center],
                   'grid_size':n,'cell_size_degrees':d,
                   'response_count':len(pts),'elevation_min_m':min(vals),
                   'elevation_max_m':max(vals),'elevation_median_m':statistics.median(vals),
                   'zero_values':sum(v==0 for v in vals),'crs':'EPSG:4326',
                   'vertical_datum':'USGS 3DEP source-specific, usually NAVD88; verify file metadata',
                   'source_sha256':hashlib.sha256((out/'USGS_3DEP_EPQS_raw_records.json').read_bytes()).hexdigest()}
          (out/'provenance.json').write_text(json.dumps(profile,indent=2)+'\n')
          print('VERIFIED USGS REAL ELEVATIONS:',json.dumps(profile,indent=2))
          print('first JSON response:',pts[0]['response'])
          PY
      - name: Preserve real source sample and raw HTTP response records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-USGS-3DEP-12x12-real-elevations
          path: usgs_real_data/
          if-no-files-found: warn
