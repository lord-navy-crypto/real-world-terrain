name: Forced sky island worldgen and Anvil proof
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - 'qa/neoforge/check_actual_sky_island.py'
      - '.github/workflows/skyland-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skyland-anvil-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Configure isolated deep-ocean world for deterministic island test
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=sky-island-proof
          level-type=realscale:skylands_test_deep_ocean
          level-seed=785312
          view-distance=3
          simulation-distance=3
          max-tick-time=-1
          online-mode=true
          PROPERTIES
          done
      - name: Generate site at X288 Z319 and flush Minecraft chunks
        working-directory: neoforge
        run: |
          python3 - <<'PY'
          import subprocess,threading,time,os,signal,pathlib
          log=pathlib.Path("build/forced-sky-island.log")
          log.parent.mkdir(parents=True,exist_ok=True)
          p=subprocess.Popen(["gradle","--no-daemon","runServer","--stacktrace"],
             stdout=subprocess.PIPE,stderr=subprocess.STDOUT,stdin=subprocess.PIPE,
             text=True,bufsize=1,start_new_session=True)
          lines=[];ready=threading.Event()
          def read():
              for line in p.stdout:
                  lines.append(line)
                  if "Done (" in line and "For help" in line:
                      ready.set()
          t=threading.Thread(target=read,daemon=True)
          t.start()
          deadline=time.time()+420
          while time.time()<deadline and p.poll() is None and not ready.is_set():
              time.sleep(1)
          if not ready.is_set():
              log.write_text("".join(lines))
              raise SystemExit("Minecraft skyland fixture server failed to boot")
          # Grid cell (0,0) site is X288 Z319 by SkyIslandLayout.mix.
          p.stdin.write("forceload add 288 319\n")
          p.stdin.flush()
          time.sleep(100)
          p.stdin.write("save-all flush\n")
          p.stdin.flush()
          time.sleep(12)
          p.stdin.write("stop\n")
          p.stdin.flush()
          try: p.wait(timeout=60)
          except subprocess.TimeoutExpired:
              os.killpg(p.pid,signal.SIGINT)
              try:p.wait(timeout=15)
              except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL)
          t.join(timeout=5)
          log.write_text("".join(lines))
          print("SKYLAND_SERVER_LOG_TAIL",log.read_text()[-5000:])
          PY
      - name: Require actual Sky Blossom biome plus placed island blocks
        working-directory: neoforge
        run: python3 ../qa/neoforge/check_actual_sky_island.py run/sky-island-proof
      - name: Upload saved island proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forced-sky-island-Anvil-proof
          path: |
            neoforge/build/forced-sky-island.log
            neoforge/run/**/sky-island-proof/level.dat
            neoforge/run/**/sky-island-proof/region/*.mca
          if-no-files-found: warn
