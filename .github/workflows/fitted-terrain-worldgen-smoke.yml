name: Fitted terrain archetype actual worldgen smoke

on:
  pull_request:
    paths:
      - "neoforge/src/main/java/org/realscale/neoforge/TerrainArchetypeDensity.java"
      - "neoforge/src/main/java/org/realscale/neoforge/TerrainArchetypeMath.java"
      - "neoforge/src/test/java/org/realscale/neoforge/TerrainArchetypeDensityTest.java"
      - "neoforge/build.gradle"
      - "neoforge/src/main/resources/data/realscale/worldgen/**"
      - "neoforge/src/main/resources/data/minecraft/tags/worldgen/world_preset/**"
      - "research/v1.1/profiles/**"
      - "qa/neoforge/audit_fitted_archetype_heightmaps.py"
      - "qa/neoforge/realscale_headless_qa.py"
      - "research/v1.1/tools/compile_terrain_archetype_profiles.py"
      - "research/v1.1/tools/fit_terrain_archetype.py"
      - "research/v1.1/tests/test_compile_terrain_archetype_profiles.py"
      - "qa/neoforge/compare_fitted_archetype_heightmaps.py"
      - ".github/workflows/fitted-terrain-worldgen-smoke.yml"
  push:
    branches: [main]
    paths:
      - "neoforge/src/main/java/org/realscale/neoforge/TerrainArchetypeDensity.java"
      - "neoforge/src/main/java/org/realscale/neoforge/TerrainArchetypeMath.java"
      - "neoforge/src/test/java/org/realscale/neoforge/TerrainArchetypeDensityTest.java"
      - "neoforge/build.gradle"
      - "neoforge/src/main/resources/data/realscale/worldgen/**"
      - "neoforge/src/main/resources/data/minecraft/tags/worldgen/world_preset/**"
      - "research/v1.1/profiles/**"
      - "qa/neoforge/audit_fitted_archetype_heightmaps.py"
      - "qa/neoforge/realscale_headless_qa.py"
      - "research/v1.1/tools/compile_terrain_archetype_profiles.py"
      - "research/v1.1/tools/fit_terrain_archetype.py"
      - "research/v1.1/tests/test_compile_terrain_archetype_profiles.py"
      - "qa/neoforge/compare_fitted_archetype_heightmaps.py"
      - ".github/workflows/fitted-terrain-worldgen-smoke.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  boot-fitted-terrain-preset:
    name: Boot ${{ matrix.slug }} preset
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: natural
            world_preset: realscale:natural_three_realms
            noise_settings: realscale:tva_natural_smoothed
          - slug: alpine
            world_preset: realscale:alpine_three_realms
            noise_settings: realscale:tva_alpine_fitted
          - slug: canyon
            world_preset: realscale:canyon_three_realms
            noise_settings: realscale:tva_canyon_fitted
          - slug: glacial
            world_preset: realscale:glacial_three_realms
            noise_settings: realscale:tva_glacial_fitted
          - slug: volcanic
            world_preset: realscale:volcanic_three_realms
            noise_settings: realscale:tva_volcanic_fitted
          - slug: karst
            world_preset: realscale:karst_three_realms
            noise_settings: realscale:tva_karst_fitted
          - slug: dune
            world_preset: realscale:dune_three_realms
            noise_settings: realscale:tva_dune_fitted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Prepare isolated fitted-archetype server world
        working-directory: neoforge
        env:
          PRESET_SLUG: ${{ matrix.slug }}
          WORLD_PRESET_ID: ${{ matrix.world_preset }}
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<PROPERTIES
          level-name=fitted-$PRESET_SLUG-smoke
          level-type=$WORLD_PRESET_ID
          level-seed=42
          spawn-protection=0
          spawn-chunk-radius=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          enable-rcon=true
          rcon.password=realscale-local-qa-20261026
          rcon.port=25575
          PROPERTIES
          done
      - name: Boot NeoForge and persist the fitted generator ID
        working-directory: neoforge
        env:
          PRESET_SLUG: ${{ matrix.slug }}
          NOISE_SETTINGS_ID: ${{ matrix.noise_settings }}
        run: |
          python3 - <<'PY'
          import gzip, os, pathlib, signal, socket, struct, subprocess, threading, time
          slug = os.environ["PRESET_SLUG"]
          expected_noise = os.environ["NOISE_SETTINGS_ID"].encode()
          world_name = f"fitted-{slug}-smoke"
          rcon_password = "realscale-local-qa-20261026"
          log = pathlib.Path(f"build/fitted-{slug}-server.log")
          log.parent.mkdir(parents=True, exist_ok=True)
          proc = subprocess.Popen(
              ["gradle", "--no-daemon", "runServer", "--stacktrace"],
              stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT, text=True, bufsize=1,
              start_new_session=True)
          lines = []
          ready = threading.Event()
          def reader():
              for line in proc.stdout:
                  lines.append(line)
                  if "Done (" in line and "For help" in line:
                      ready.set()
          thread = threading.Thread(target=reader, daemon=True)
          thread.start()
          deadline = time.monotonic() + 480
          while time.monotonic() < deadline and proc.poll() is None and not ready.is_set():
              time.sleep(1)

          rcon_error = None
          rcon = None
          def recv_exact(conn, count):
              data = bytearray()
              while len(data) < count:
                  part = conn.recv(count - len(data))
                  if not part:
                      raise ConnectionError("RCON closed before the full packet arrived")
                  data.extend(part)
              return bytes(data)
          def rcon_packet(conn, packet_id, packet_type, command):
              payload = command.encode("utf-8") + b"\x00\x00"
              conn.sendall(struct.pack("<iii", len(payload) + 8, packet_id, packet_type) + payload)
              length = struct.unpack("<i", recv_exact(conn, 4))[0]
              body = recv_exact(conn, length)
              response_id, response_type = struct.unpack("<ii", body[:8])
              return response_id, response_type, body[8:-2].decode("utf-8", errors="replace")
          def rcon_command(conn, command, packet_id):
              response_id, response_type, response = rcon_packet(conn, packet_id, 2, command)
              if response_id != packet_id:
                  raise RuntimeError(f"Unexpected RCON response id {response_id} for {command!r}")
              return response

          if ready.is_set():
              print(f"FITTED_{slug.upper()}_SERVER_BOOT_OK")
              try:
                  last_error = None
                  for _ in range(30):
                      try:
                          rcon = socket.create_connection(("127.0.0.1", 25575), timeout=3)
                          rcon.settimeout(10)
                          break
                      except OSError as exc:
                          last_error = exc
                          time.sleep(1)
                  if rcon is None:
                      raise RuntimeError(f"Could not connect to local Minecraft RCON: {last_error}")
                  auth_id, auth_type, auth_text = rcon_packet(rcon, 1, 3, rcon_password)
                  if auth_id == -1:
                      raise RuntimeError("Minecraft RCON authentication was rejected")
                  if auth_id != 1:
                      raise RuntimeError(f"Unexpected RCON auth response id: {auth_id}")
                  force_result = rcon_command(rcon, "forceload add 992 992 1071 1071", 2)
                  print("RCON_FORCELOAD_RESULT:", force_result)
                  if "Unknown command" in force_result or "Failed" in force_result:
                      raise RuntimeError(f"Minecraft rejected target forceload: {force_result}")
                  # Direct RCON starts the target sample immediately after the
                  # server is ready; it does not depend on scheduled game ticks.
                  # Five-by-five chunks still provide 6,400 X/Z columns while
                  # avoiding a large, expensive sample for the slowest modes.
                  time.sleep(240)
                  save_result = rcon_command(rcon, "save-all flush", 3)
                  print("RCON_SAVE_RESULT:", save_result)
                  try:
                      print("RCON_STOP_RESULT:", rcon_command(rcon, "stop", 4))
                  except (OSError, ConnectionError, RuntimeError) as exc:
                      print("RCON_STOP_CONNECTION_CLOSED:", repr(exc))
              except Exception as exc:
                  rcon_error = repr(exc)
                  print("RCON_QA_FAILURE:", rcon_error)
              finally:
                  if rcon is not None:
                      try:
                          rcon.close()
                      except OSError:
                          pass

          # Prefer the server's RCON stop command; signal the isolated Gradle
          # process group only if the child does not exit cleanly.
          if proc.poll() is None:
              try:
                  proc.wait(timeout=120)
              except subprocess.TimeoutExpired:
                  os.killpg(proc.pid, signal.SIGINT)
                  try:
                      proc.wait(timeout=90)
                  except subprocess.TimeoutExpired:
                      os.killpg(proc.pid, signal.SIGTERM)
                      try:
                          proc.wait(timeout=20)
                      except subprocess.TimeoutExpired:
                          os.killpg(proc.pid, signal.SIGKILL)
                          proc.wait()
          thread.join(timeout=3)
          log.write_text("".join(lines), encoding="utf-8")
          print("SERVER_LOG_TAIL:", log.read_text(encoding="utf-8")[-8000:])
          saved_worlds = list(pathlib.Path("run").glob(f"**/{world_name}/level.dat"))
          valid = False
          generated_regions = []
          for path in saved_worlds:
              try:
                  data = gzip.decompress(path.read_bytes())
                  if (expected_noise in data
                      and b"realscale:grand_nether" in data
                      and b"realscale:grand_end" in data):
                      print("FITTED_PRESET_PERSISTED:", path)
                      valid = True
                      generated_regions.extend(
                          region for region in (path.parent / "region").glob("*.mca")
                          if region.is_file() and region.stat().st_size > 8192
                      )
              except Exception as exc:
                  print("LEVEL_DAT_READ_FAILURE:", path, exc)
          if not ready.is_set() or rcon_error or not valid or not generated_regions:
              raise SystemExit(
                  f"Fitted {slug} preset failed to boot, RCON-generate target chunks, "
                  f"persist expected noise settings, or save Anvil region chunks. "
                  f"regions={len(generated_regions)}, rcon_error={rcon_error}"
              )
          print("GENERATED_ANVIL_REGIONS:", [str(p) for p in generated_regions])
          PY
      - name: Audit persisted WORLD_SURFACE heightmaps
        working-directory: neoforge
        env:
          PRESET_SLUG: ${{ matrix.slug }}
        run: |
          python3 ../qa/neoforge/audit_fitted_archetype_heightmaps.py \
            --run-root run \
            --world-name "fitted-${PRESET_SLUG}-smoke" \
            --slug "${PRESET_SLUG}" \
            --target-chunk-min 62 \
            --target-chunk-max 66 \
            --output "build/fitted-${PRESET_SLUG}-height-summary.json"
      - name: Upload fitted-archetype heightmap summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-Fitted-${{ matrix.slug }}-Heightmap-Summary
          path: neoforge/build/fitted-${{ matrix.slug }}-height-summary.json
          if-no-files-found: warn
      - name: Upload fitted-archetype server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-Fitted-${{ matrix.slug }}-Worldgen-Smoke
          path: |
            neoforge/build/fitted-${{ matrix.slug }}-server.log
            neoforge/build/fitted-${{ matrix.slug }}-height-summary.json
            neoforge/run/**/fitted-${{ matrix.slug }}-smoke/level.dat
            neoforge/run/**/fitted-${{ matrix.slug }}-smoke/region/*.mca
          if-no-files-found: warn

  compare-saved-heightmaps:
    name: Compare persisted heightmaps across seven modes
    if: always()
    needs: boot-fitted-terrain-preset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: RealScale-Fitted-*-Heightmap-Summary
          path: fitted-heightmap-summaries
          merge-multiple: false
      - name: Require each fitted mode to change saved surface heights
        run: |
          python3 qa/neoforge/compare_fitted_archetype_heightmaps.py \
            fitted-heightmap-summaries \
            --output fitted-archetype-heightmap-comparison.json
      - name: Upload heightmap comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-Fitted-Heightmap-Comparison
          path: fitted-archetype-heightmap-comparison.json
          if-no-files-found: warn
