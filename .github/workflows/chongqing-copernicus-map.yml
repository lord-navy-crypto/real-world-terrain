name: Chaotianmen OPEN Copernicus georeferenced satellite evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/chongqing_copernicus_landcover.py'
      - 'tools/chongqing_fetch_copernicus.py'
      - 'qa/test_chongqing_copernicus.py'
      - 'qa/test_chongqing_standalone_world.py'
      - 'tools/chongqing_export_standalone_world.py'
      - '.github/workflows/chongqing-copernicus-map.yml'

permissions:
  contents: read

jobs:
  build-attributed-satellite-ground:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install georeferenced open EO data readers
        run: python3 -m pip install 'numpy>=1.26,<3' 'rasterio>=1.3,<2' 'pystac-client>=0.8,<1' 'planetary-computer>=1.0,<2'
      - name: Verify satellite spectral and 10m classification limits
        run: python3 -m unittest discover -s qa -p 'test_chongqing_copernicus.py' -v
      - name: Load REAL Copernicus Sentinel-2 imagery by public STAC source
        run: |
          python3 tools/chongqing_fetch_copernicus.py \
            --output build/chaotianmen-copernicus-10m-surface-v1.json.gz
      - name: Require source ID, license, cloud-free measurements, no imaginary 1m bands
        run: |
          python3 - <<'PY'
          import json,gzip,hashlib
          data=json.load(gzip.open(
              'build/chaotianmen-copernicus-10m-surface-v1.json.gz','rt'))
          assert data['license']=='Copernicus Sentinel free and open data'
          assert data['resolution_m']==10
          assert data['source_stac_item'].startswith(('S2A_','S2B_','S2C_'))
          assert data['known_surface_columns']>=1000
          assert sum(data['materials'].values())==data['known_surface_columns']
          assert set(data['materials'])<= {'grass','urban_inferred'}
          assert all(r[4] in ('low','medium') for r in data['rows'])
          assert 'source_datetime_utc' in data
          print('REAL GEOGRAPHICALLY REFERENCED 10m SENTINEL PASS:',
                data['source_stac_item'],
                data['source_cloud_cover_pct'],
                data['materials'])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Chaotianmen-Authentic-Copernicus-Sentinel2-10m-Landcover
          retention-days: 30
          path: build/chaotianmen-copernicus-10m-surface-v1.json.gz
          if-no-files-found: error
