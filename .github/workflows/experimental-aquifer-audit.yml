name: EXPERIMENT Aquifer original-return and fluid-tick audit
on:
  push:
    branches: [experiment/vanilla-aquifer-readonly-audit]
    paths:
      - '.github/workflows/experimental-aquifer-audit.yml'
      - 'neoforge/src/main/java/org/realscale/neoforge/AquiferReadOnlyStats.java'
      - 'neoforge/src/main/java/org/realscale/neoforge/mixin/AquiferReadOnlyAuditMixin.java'
      - 'neoforge/src/main/java/org/realscale/neoforge/mixin/AquiferReadOnlyAuditMixinPlugin.java'
      - 'neoforge/src/main/resources/realscale.aquifer.audit.mixins.json'
      - 'neoforge/src/main/resources/META-INF/neoforge.mods.toml'
      - 'neoforge/src/test/java/org/realscale/neoforge/AquiferReadOnlyStatsSmoke.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aquifer-original-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: tva_measured_three_realms
            seed: 2
          - preset: tva_sacred_timeline_three_realms
            seed: 42
    name: Aquifer read-only sampling / ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Unit-test sampling cadence and all observed result classes
        run: |
          mkdir -p build/aquifer-audit
          javac -d build/aquifer-audit \
            neoforge/src/main/java/org/realscale/neoforge/AquiferReadOnlyStats.java \
            neoforge/src/test/java/org/realscale/neoforge/AquiferReadOnlyStatsSmoke.java
          java -cp build/aquifer-audit org.realscale.neoforge.AquiferReadOnlyStatsSmoke
      - name: Prepare identical world for vanilla and read-only original audit
        env:
          PRESET: ${{ matrix.preset }}
          SEED: ${{ matrix.seed }}
        run: |
          for variant in vanilla audited; do
            git worktree add --detach "$RUNNER_TEMP/realscale-$variant" "$GITHUB_SHA"
            root="$RUNNER_TEMP/realscale-$variant/neoforge"
            for dir in run run/server run/gametestserver; do
              mkdir -p "$root/$dir"
              printf 'eula=true\n' > "$root/$dir/eula.txt"
              cat > "$root/$dir/server.properties" <<PROPERTIES
          level-name=world
          level-type=realscale:$PRESET
          level-seed=$SEED
          generate-structures=true
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          server-ip=127.0.0.1
          enable-rcon=true
          rcon.port=25575
          rcon.password=realscale_ci_probe_only
          PROPERTIES
            done
          done
      - name: Vanilla aquifer original (no mixin, separate fresh world)
        env:
          PRESET: ${{ matrix.preset }}
          JAVA_TOOL_OPTIONS: -Drealscale.experimental.aquifer.audit=false
        run: |
          cd "$RUNNER_TEMP/realscale-vanilla/neoforge"
          python3 ../qa/neoforge/rcon_worldgen_smoke.py . "realscale:$PRESET" distant_route
      - name: Read-only sampled ORIGINAL Aquifer results (no shortcuts)
        env:
          PRESET: ${{ matrix.preset }}
          JAVA_TOOL_OPTIONS: -Drealscale.experimental.aquifer.audit=true
        run: |
          cd "$RUNNER_TEMP/realscale-audited/neoforge"
          python3 ../qa/neoforge/rcon_worldgen_smoke.py . "realscale:$PRESET" distant_route
      - name: Require nonempty real Aquifer result observations
        run: |
          log="$RUNNER_TEMP/realscale-audited/neoforge/build/rcon_distant_route_server.log"
          grep -q 'REALSCALE_AQUIFER_READONLY_MIXIN_DECISION.*enabled=true' "$log"
          python3 - "$log" <<'PY'
          import re,sys
          data=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          match=re.search(
              r'REALSCALE_AQUIFER_READONLY_AUDIT calls=(\d+) samples=(\d+) positive_density=(\d+) nonpositive_density=(\d+) returned_null=(\d+) returned_air=(\d+) returned_fluid=(\d+) returned_other=(\d+) schedule_fluid_update=(\d+) adjacent_sample_repeat=(\d+)',
              data)
          assert match is not None,"Missing Aquifer original-result observer"
          calls,samples,positive,nonpositive,nulls,air,fluid,other,updates,repeats=map(int,match.groups())
          assert calls>=samples>100,"Not enough real aquifer samples"
          assert samples==positive+nonpositive,"Density category loss"
          assert samples==nulls+air+fluid+other,"Return category loss"
          assert 0<=updates<=samples,"Fluid update sample rate invalid"
          assert 0<=repeats<=samples,"Impossible sampled repeat rate"
          print("REALSCALE_AQUIFER_ORIGINAL_OBSERVATIONS_PASS",match.groups(),flush=True)
          PY
      - name: Investigate saved-world block/fluid/biome parity (no changes allowed)
        continue-on-error: true
        run: |
          python3 qa/neoforge/compare_vanilla_aquifer_worlds.py \
            "$RUNNER_TEMP/realscale-vanilla/neoforge" \
            "$RUNNER_TEMP/realscale-audited/neoforge"
      - name: Preserve actual worldgen and aquifer counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Experimental-Aquifer-ReadOnly-${{ matrix.preset }}
          path: |
            ${{ runner.temp }}/realscale-vanilla/neoforge/build/rcon_distant_route_server.log
            ${{ runner.temp }}/realscale-audited/neoforge/build/rcon_distant_route_server.log
            ${{ runner.temp }}/realscale-vanilla/neoforge/build/rcon_distant_route_timing.json
            ${{ runner.temp }}/realscale-audited/neoforge/build/rcon_distant_route_timing.json
          if-no-files-found: warn
