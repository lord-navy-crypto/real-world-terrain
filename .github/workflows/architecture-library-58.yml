name: RealScale 100-Structure Build and Dedicated-Server QA

on:
  push:
    branches:
      - main
    paths:
      - 'assets/architecture/**'
      - 'scripts/convert_gdmc_architecture.py'
      - 'scripts/generate_original_architecture.py'
      - 'scripts/generate_architecture_batch.py'
      - 'scripts/generate_architecture_expansion.py'
      - 'scripts/architecture_expansion_profiles.json'
      - 'neoforge/**'
      - 'qa/run_architecture_server_smoke.py'
      - 'qa/test_architecture_pilot_pack.py'
      - 'qa/test_builtin_structure_packs.py'
      - '.github/workflows/architecture-library-58.yml'
  pull_request:
    paths:
      - 'assets/architecture/**'
      - 'scripts/convert_gdmc_architecture.py'
      - 'scripts/generate_original_architecture.py'
      - 'scripts/generate_architecture_batch.py'
      - 'scripts/generate_architecture_expansion.py'
      - 'scripts/architecture_expansion_profiles.json'
      - 'neoforge/**'
      - 'qa/run_architecture_server_smoke.py'
      - 'qa/test_architecture_pilot_pack.py'
      - 'qa/test_builtin_structure_packs.py'
      - '.github/workflows/architecture-library-58.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realscale-architecture-100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-server-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build NeoForge mod and generate all 100 architecture NBT
        working-directory: neoforge
        run: gradle --no-daemon --stacktrace clean build

      - name: Validate the complete 100-template inventory, NBT, licenses, density budget and pack wiring
        run: |
          python3 -m unittest discover -s qa -p 'test_architecture_pilot_pack.py' -v
          python3 -m unittest discover -s qa -p 'test_builtin_structure_packs.py' -v
          python3 - <<'PY'
          from pathlib import Path
          root = Path("neoforge/build/resources/main/data/realscale/structure/architecture")
          files = sorted(root.glob("*.nbt"))
          print("PACKAGED_ARCHITECTURE_TEMPLATE_COUNT:", len(files))
          if len(files) != 100:
              raise SystemExit(f"Expected 100 packaged templates, found {len(files)}")
          print("PACKAGED_ARCHITECTURE_TEMPLATE_IDS:")
          for path in files:
              print(path.stem)
          PY

      - name: Prepare isolated NeoForge server acceptance environment
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=architecture-100-smoke
          level-type=minecraft\:normal
          level-seed=580058
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          enable-rcon=true
          rcon.port=25575
          rcon.password=architecture-smoke-local-only
          PROPERTIES
          done

      - name: Boot dedicated server and place all 100 templates through RCON
        working-directory: neoforge
        run: python3 ../qa/run_architecture_server_smoke.py

      - name: Verify DH 3.3.3 and Chunky 1.4.23 against the expanded RealScale JAR
        working-directory: neoforge
        run: python3 ../qa/run_dh_chunky_runtime_smoke.py

      - name: Upload installable JAR and server acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-Architecture-100-NeoForge-1.21.1
          path: |
            neoforge/build/libs/*.jar
            neoforge/run/architecture-pilot-server-smoke.log
            neoforge/run/dh-chunky-runtime-smoke.log
          if-no-files-found: warn
          retention-days: 30
