name: Biodiversity v3 Sacred and Measured real server proof
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - 'qa/neoforge/biodiversity_v3_world_boot.py'
      - '.github/workflows/biodiversity-v3-world.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v3-spawn-and-biome-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        base: [sacred, measured]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build NeoForge mod with new biodiversity v3 registry
        run: cd neoforge && gradle --no-daemon build
      - name: Boot new v3 world and check real spawn, End and NBT persisted codec
        env:
          REALSCALE_BIODIVERSITY_BASE: ${{ matrix.base }}
        run: python3 qa/neoforge/biodiversity_v3_world_boot.py
      - name: Upload v3 worldgen proof and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVA-Biodiversity-V3-${{ matrix.base }}-Proof
          path: |
            neoforge/build/biodiversity-v3-spawn-*.log
            neoforge/run/**/biodiversity-v3-spawn-${{ matrix.base }}/level.dat
            neoforge/run/**/biodiversity-v3-spawn-${{ matrix.base }}/region/*.mca
          if-no-files-found: warn
