name: RealScale World Studio

on:
  push:
    branches:
      - feature/realscale-world-studio-mvp
    paths:
      - "world-studio/**"
      - ".github/workflows/world-studio.yml"
  pull_request:
    paths:
      - "world-studio/**"
      - ".github/workflows/world-studio.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build browser studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-studio
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
