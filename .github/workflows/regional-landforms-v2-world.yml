name: Global highland atlas v2 - 16 morphologies real server
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - 'qa/neoforge/regional_landform_atlas_v2_world_boot.py'
      - '.github/workflows/regional-landforms-v2-world.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regional-atlas-world:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build 8km macro-regions and versioned 16-shape Highland generator
        run: cd neoforge && gradle --no-daemon build
      - name: Boot actual regional atlas, verify all End spawn modes and persistent NBT
        run: python3 qa/neoforge/regional_landform_atlas_v2_world_boot.py
      - name: Preserve actual generated world and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sixteen-Regional-Highlands-V2-Real-World-Proof
          path: |
            neoforge/build/regional-landform-atlas-v2-*.log
            neoforge/run/**/regional-landform-atlas-v2-*/level.dat
            neoforge/run/**/regional-landform-atlas-v2-*/region/*.mca
          if-no-files-found: warn
