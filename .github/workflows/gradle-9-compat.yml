name: RealScale Gradle 9.8 client task and NeoForge build compatibility
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'neoforge/build.gradle'
      - 'neoforge/settings.gradle'
      - 'neoforge/gradle.properties'
      - 'neoforge/gradle/**'
      - 'neoforge/gradlew*'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/gradle-9-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gradle-nine:
    # PR 164 is a clipmap-only Draft; full checks resume at review.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 164 || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Verify actual client run task is registered in Gradle 9.8
        working-directory: neoforge
        run: gradle --no-daemon --console=plain tasks --all | grep -E '^[[:space:]]*runClient([[:space:]]|$)'
      - name: Assert actual JUnit test discovery on Gradle 9.8
        working-directory: neoforge
        run: gradle --no-daemon --console=plain --stacktrace test
      - name: Build full NeoForge mod on Gradle 9.8
        working-directory: neoforge
        run: gradle --no-daemon --console=plain --stacktrace build
