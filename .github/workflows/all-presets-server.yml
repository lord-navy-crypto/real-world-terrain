name: Additional six terrain presets real NeoForge server and cave audit
on:
  push:
    branches: [main]
    paths: ['neoforge/**', 'qa/neoforge/**', '.github/workflows/all-presets-server.yml']
  pull_request:
    paths: ['neoforge/**', 'qa/neoforge/**', '.github/workflows/all-presets-server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neoforge-worldgen:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        preset: [continental, georeal_ultimate, grand_canyon, himalayan, realistic_mountains, ultimate]
    name: Real worldgen QA / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare EULA and actual world type
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=world
          level-type=realscale:${{ matrix.preset }}
          level-seed=785312
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          server-ip=127.0.0.1
          enable-rcon=true
          rcon.port=25575
          rcon.password=realscale_ci_probe_only
          PROPERTIES
          done
      - name: Boot and sample distant actual worldgen chunks using authenticated RCON
        working-directory: neoforge
        run: python3 ../qa/neoforge/rcon_worldgen_smoke.py . 'realscale:${{ matrix.preset }}' distant
      - name: Inspect ACTUAL saved terrain columns, abrupt cliffs and underground voids
        working-directory: neoforge
        run: python3 ../qa/neoforge/check_realism_continuity.py . '${{ matrix.preset }}'
      - name: Upload server diagnostics and generated world metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RealScale-${{ matrix.preset }}-SavedWorld-QA
          path: |
            neoforge/realism_continuity_qa.json
            neoforge/build/rcon_distant_server.log
            neoforge/run/**/level.dat
            neoforge/run/**/region/*.mca
            neoforge/run/**/logs/latest.log
          if-no-files-found: warn
