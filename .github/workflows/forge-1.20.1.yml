name: Forge 1.20.1 Build

on:
  push:
    branches:
      - feature/forge-1.20.1-port
    paths:
      - "forge/**"
      - "scripts/**"
      - "assets/architecture/**"
      - ".github/workflows/forge-1.20.1.yml"
  pull_request:
    paths:
      - "forge/**"
      - "scripts/**"
      - "assets/architecture/**"
      - ".github/workflows/forge-1.20.1.yml"

permissions:
  contents: read

concurrency:
  group: forge-1.20.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            forge
            scripts
            assets/architecture

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.8"

      - name: Build Forge module in isolation
        run: |
          test ! -d neoforge
          gradle --no-daemon -p forge clean build
      - name: Audit the actual Forge JAR
        run: python3 forge/tools/audit_jar.py forge/build/libs/RealScale-Forge-1.20.1-*.jar

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-Forge-1.20.1
          path: forge/build/libs/*.jar
          if-no-files-found: error
      - name: Smoke-test dedicated server with the RealScale default preset
        timeout-minutes: 6
        env:
          REALSCALE_FORGE_CI_SMOKE: server
        run: |
          mkdir -p forge/run
          printf "eula=true\n" > forge/run/eula.txt
          cat > forge/run/server.properties <<'EOF'
          level-name=forge-smoke
          level-type=realscale:natural_automate_three_realms
          online-mode=false
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          max-tick-time=120000
          motd=RealScale Forge 1.20.1 CI smoke
          EOF
          set +e
          timeout --signal=TERM --kill-after=15s 300s gradle --no-daemon -p forge runServer --args='--nogui' > forge-server-smoke.log 2>&1
          server_status=$?
          set -e
          if [ "$server_status" -ne 0 ] && [ "$server_status" -ne 124 ]; then
            tail -150 forge-server-smoke.log || true
            exit "$server_status"
          fi
          if ! grep -q 'Done (' forge/run/logs/latest.log || ! grep -q 'FORGE_SERVER_TEMPLATE_SMOKE_OK' forge-server-smoke.log; then
            echo "Forge server did not reach the ready state."
            cat forge/run/logs/latest.log || true
            exit 1
          fi
          echo "Forge server loaded the RealScale preset and reached the ready state."

      - name: Install standalone Forge and test the distributable JAR
        timeout-minutes: 8
        env:
          REALSCALE_FORGE_CI_SMOKE: server
        run: |
          set -euo pipefail
          mkdir -p forge-production/mods
          cp forge/build/libs/RealScale-Forge-1.20.1-*.jar forge-production/mods/
          cd forge-production
          curl --fail --location --retry 3 -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.28/forge-1.20.1-47.4.28-installer.jar
          java -jar forge-installer.jar --installServer > installer.log 2>&1 || { tail -150 installer.log; exit 1; }
          printf 'eula=true\n' > eula.txt
          cat > server.properties <<'EOF'
          level-name=production-smoke
          level-type=realscale:natural_automate_three_realms
          server-ip=127.0.0.1
          online-mode=false
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          max-tick-time=120000
          EOF
          printf '%s\n' '-Xmx4G' > user_jvm_args.txt
          timeout --signal=TERM --kill-after=15s 300s bash run.sh nogui > production-server.log 2>&1 || { tail -150 production-server.log; exit 1; }
          grep -F 'Done (' logs/latest.log
          grep -F 'FORGE_SERVER_TEMPLATE_SMOKE_OK' production-server.log
          echo 'FORGE_STANDALONE_JAR_SMOKE_OK'

      - name: Start Forge client and render RealScale UI
        timeout-minutes: 6
        env:
          REALSCALE_FORGE_CI_SMOKE: client
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSOFT_DRIVERS: "null"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0
          timeout 240s xvfb-run -a -s "-screen 0 1280x720x24" gradle --no-daemon -p forge runClient > forge-client-smoke.log 2>&1 || { tail -150 forge-client-smoke.log; exit 1; }
          grep 'FORGE_CLIENT_UI_SMOKE_OK' forge-client-smoke.log
      - name: Upload Forge integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-Forge-integration-logs
          path: |
            forge-server-smoke.log
            forge-client-smoke.log
            forge/run/logs/
            forge/run/crash-reports/
            forge-production/installer.log
            forge-production/production-server.log
            forge-production/logs/
            forge-production/crash-reports/
          if-no-files-found: ignore
