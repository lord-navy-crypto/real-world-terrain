name: Forge 1.20.1 Build

on:
  push:
    branches:
      - feature/forge-1.20.1-port
    paths:
      - "forge/**"
      - ".github/workflows/forge-1.20.1.yml"
  pull_request:
    paths:
      - "forge/**"
      - ".github/workflows/forge-1.20.1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.8"

      - name: Build Forge module
        run: gradle --no-daemon -p forge clean build

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-Forge-1.20.1
          path: forge/build/libs/*.jar
          if-no-files-found: error
