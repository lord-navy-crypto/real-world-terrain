name: Forge 1.20.1 Build

on:
  push:
    branches:
      - feature/forge-1.20.1-port
    paths:
      - "forge/**"
      - ".github/workflows/forge-1.20.1.yml"
  pull_request:
    paths:
      - "forge/**"
      - ".github/workflows/forge-1.20.1.yml"

permissions:
  contents: read

concurrency:
  group: forge-1.20.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.8"

      - name: Build Forge module
        run: gradle --no-daemon -p forge clean build

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-Forge-1.20.1
          path: forge/build/libs/*.jar
          if-no-files-found: error
      - name: Smoke-test dedicated server with the RealScale default preset
        timeout-minutes: 4
        run: |
          mkdir -p forge/run
          printf "eula=true\n" > forge/run/eula.txt
          cat > forge/run/server.properties <<'EOF'
          level-name=forge-smoke
          level-type=realscale:natural_automate_three_realms
          online-mode=false
          view-distance=2
          simulation-distance=2
          spawn-protection=0
          max-tick-time=120000
          motd=RealScale Forge 1.20.1 CI smoke
          EOF
          set +e
          timeout --signal=TERM --kill-after=15s 180s gradle --no-daemon -p forge runServer --args='--nogui'
          server_status=$?
          set -e
          if [ "$server_status" -ne 0 ] && [ "$server_status" -ne 124 ]; then
            cat forge/run/logs/latest.log || true
            exit "$server_status"
          fi
          if ! grep -q 'Done (' forge/run/logs/latest.log; then
            echo "Forge server did not reach the ready state."
            cat forge/run/logs/latest.log || true
            exit 1
          fi
          echo "Forge server loaded the RealScale preset and reached the ready state."
