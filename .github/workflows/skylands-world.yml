name: Deep-ocean Sky Blossom world preset boot
# Keep only the newest PR validation; old experimental commits must not
# monopolize expensive high-ceiling Minecraft server runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - '.github/workflows/skylands-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skylands-preset-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare an isolated ecotone world
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=skylands-test
          level-type=realscale:realism_max_ecotones_skylands
          level-seed=785312
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          PROPERTIES
          done
      - name: Boot NeoForge and persist world generated with natural ecotone BiomeSource
        working-directory: neoforge
        run: |
          python3 - <<'PY'
          import subprocess,threading,time,os,signal,gzip,pathlib
          logfile=pathlib.Path('build/skylands-server.log')
          logfile.parent.mkdir(exist_ok=True,parents=True)
          p=subprocess.Popen(['gradle','--no-daemon','runServer','--stacktrace'],stdin=subprocess.PIPE,
                             stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1,
                             start_new_session=True)
          lines=[];ready=threading.Event()
          def read():
            for line in p.stdout:
              lines.append(line)
              if 'Done (' in line and 'For help' in line:ready.set()
          t=threading.Thread(target=read,daemon=True);t.start()
          deadline=time.time()+420
          while time.time()<deadline and p.poll() is None and not ready.is_set():time.sleep(1)
          if ready.is_set():time.sleep(15)
          try:
            if p.poll() is None:
              p.stdin.write('stop\n');p.stdin.flush();p.wait(timeout=50)
          except Exception:
            if p.poll() is None:
              os.killpg(p.pid,signal.SIGINT)
              try:p.wait(timeout=15)
              except subprocess.TimeoutExpired:
                os.killpg(p.pid,signal.SIGKILL);p.wait()
          t.join(timeout=3)
          logfile.write_text(''.join(lines))
          print('server_boot_ready',ready.is_set(),'output_tail',logfile.read_text()[-9000:])
          found=False
          for path in pathlib.Path('run').glob('**/level.dat'):
            data=gzip.decompress(path.read_bytes())
            if b'realscale:sky_ocean' in data and b'realscale:natural_ecotones' in data:
              print('CUSTOM_SKYLANDS_PRESET_PERSISTED',path)
              found=True
          if not ready.is_set() or not found:
            raise SystemExit('FAIL: skylands preset did not boot into a persisted new world')
          print('PASS: sky-ocean biome source registry decode and dedicated server world boot')
          PY
      - name: Check skylands world region data was created
        working-directory: neoforge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path("run").glob("**/skylands-test/region/*.mca"))
          assert files, "No actual skylands Anvil region was saved"
          assert any(x.stat().st_size >= 8192 for x in files), "Missing region header"
          print("PASS: skylands generator created region files:",len(files))
          PY
      - name: Upload ecotone test diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Skylands-server-boot-log
          path: |
            neoforge/build/skylands-server.log
            neoforge/run/**/skylands-test/level.dat
            neoforge/run/**/skylands-test/region/*.mca
          if-no-files-found: warn
