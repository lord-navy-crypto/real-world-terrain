name: Fabric 1.20.1 Compatibility Matrix

on:
  push:
    branches: [feature/fabric-1.20.1-port]
    paths: ['fabric/**', 'scripts/**', 'assets/architecture/**', '.github/workflows/fabric-1.20.1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fabric-1.20.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Loader ${{ matrix.loader_version }} / API ${{ matrix.api_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported pair: Fabric API 0.92.6 declares Loader >=0.16.10.
          - loader_version: '0.16.10'
            api_version: '0.92.6+1.20.1'
            integration: true
          - loader_version: '0.16.14'
            api_version: '0.92.6+1.20.1'
            integration: false
          - loader_version: '0.16.14'
            api_version: '0.92.12+1.20.1'
            integration: false
          # Newer Loader and latest 1.20.1 API release candidate.
          - loader_version: '0.19.5'
            api_version: '0.92.12+1.20.1'
            integration: true
    env:
      FABRIC_LOADER_VERSION: ${{ matrix.loader_version }}
      FABRIC_API_VERSION: ${{ matrix.api_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            fabric
            scripts
            assets/architecture

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Independent Fabric build
        run: |
          test ! -d forge
          test ! -d neoforge
          gradle --no-daemon -p fabric clean build

      - name: Audit remapped JAR
        run: |
          python3 - <<'PY'
          import glob, zipfile
          jars = [j for j in glob.glob("fabric/build/libs/RealScale-Fabric-1.20.1-*.jar") if not j.endswith(("-dev.jar", "-sources.jar"))]
          assert len(jars) == 1, jars
          with zipfile.ZipFile(jars[0]) as z:
              names = z.namelist()
              assert "fabric.mod.json" in names
              assert "META-INF/mods.toml" not in names
              assert "META-INF/neoforge.mods.toml" not in names
              assert not any("/forge/biome_modifier/" in n for n in names)
              assert "data/realscale/worldgen/world_preset/natural_automate_three_realms.json" in names
              rules = [n for n in names if n.startswith("realscale/biome_modifiers/") and n.endswith(".json")]
              arch = [n for n in names if n.startswith("data/realscale/structures/architecture/") and n.endswith(".nbt")]
              urban = [n for n in names if n.startswith("data/realscale/structures/urban/") and n.endswith(".nbt")]
              assert len(rules) == 120, len(rules)
              assert len(arch) == 100 and len(urban) == 4, (len(arch), len(urban))
              for n in names:
                  if n.endswith(".class"):
                      assert b"net/minecraftforge/" not in z.read(n), n
                      assert b"net/neoforged/" not in z.read(n), n
              metadata = z.read("fabric.mod.json").decode("utf-8")
              assert '">=0.16.10"' in metadata
              print("FABRIC_JAR_AUDIT_OK", len(rules), len(arch), len(urban))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: RealScale-Fabric-1.20.1-L${{ matrix.loader_version }}-A${{ matrix.api_version }}
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-dev.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Generate Natural Automate world on Fabric
        if: matrix.integration
        timeout-minutes: 7
        env:
          REALSCALE_FABRIC_CI_SMOKE: server
        run: |
          mkdir -p fabric/run
          printf 'eula=true\n' > fabric/run/eula.txt
          cat > fabric/run/server.properties <<'EOF'
          level-name=fabric-smoke
          level-type=realscale:natural_automate_three_realms
          server-ip=127.0.0.1
          online-mode=false
          view-distance=2
          simulation-distance=2
          max-tick-time=120000
          EOF
          timeout --signal=TERM --kill-after=15s 360s gradle --no-daemon -p fabric runServer > fabric-server.log 2>&1 || { tail -150 fabric-server.log; exit 1; }
          grep -F 'Done (' fabric/run/logs/latest.log
          grep -F 'FABRIC_SERVER_TEMPLATE_SMOKE_OK' fabric-server.log

      - name: Standalone Fabric remapped JAR smoke
        if: matrix.integration
        timeout-minutes: 8
        env:
          REALSCALE_FABRIC_CI_SMOKE: server
        run: |
          mkdir -p fabric-production/mods
          find fabric/build/libs -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' -exec cp {} fabric-production/mods/ \;
          cd fabric-production
          curl -fL --retry 3 -o server.jar "https://meta.fabricmc.net/v2/versions/loader/1.20.1/${FABRIC_LOADER_VERSION}/1.0.3/server/jar"
          curl -fL --retry 3 -o mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${FABRIC_API_VERSION}/fabric-api-${FABRIC_API_VERSION}.jar"
          cp ../fabric/run/server.properties .
          printf 'eula=true\n' > eula.txt
          timeout --signal=TERM --kill-after=15s 360s java -Xmx4G -jar server.jar nogui > standalone.log 2>&1 || { tail -150 standalone.log; exit 1; }
          grep -F 'Done (' logs/latest.log
          grep -F 'FABRIC_SERVER_TEMPLATE_SMOKE_OK' standalone.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fabric-integration-logs-L${{ matrix.loader_version }}-A${{ matrix.api_version }}
          path: |
            fabric-server.log
            fabric/run/logs/
            fabric/run/crash-reports/
            fabric-production/standalone.log
            fabric-production/logs/
            fabric-production/crash-reports/
          if-no-files-found: ignore

  client-compatibility:
    name: Client ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vanilla-no-yacl
            renderer_stack: vanilla
            include_yacl_dev: 'false'
            expected_marker: FABRIC_CLIENT_NO_YACL_SMOKE_OK
          - name: vanilla-with-yacl
            renderer_stack: vanilla
            include_yacl_dev: 'true'
            expected_marker: FABRIC_CLIENT_UI_SMOKE_OK
          - name: sodium-indium
            renderer_stack: sodium_indium
            include_yacl_dev: 'true'
            expected_marker: FABRIC_CLIENT_UI_SMOKE_OK
          - name: sodium-iris-indium
            renderer_stack: sodium_iris_indium
            include_yacl_dev: 'true'
            expected_marker: FABRIC_CLIENT_UI_SMOKE_OK
          - name: sodium-iris-indium-dh
            renderer_stack: sodium_iris_indium_dh
            include_yacl_dev: 'true'
            expected_marker: FABRIC_CLIENT_UI_SMOKE_OK
    env:
      FABRIC_LOADER_VERSION: '0.19.5'
      FABRIC_API_VERSION: '0.92.12+1.20.1'
      JAVA_TOOL_OPTIONS: '-Drealscale.fabric.ci.clientSmoke=true'
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            fabric
            scripts
            assets/architecture
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Install headless client display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0
      - name: Launch client with selected optional compatibility stack
        timeout-minutes: 5
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 180s xvfb-run -a -s "-screen 0 1280x720x24" gradle --no-daemon -p fabric runClient \
            -Prealscale_include_yacl_dev=${{ matrix.include_yacl_dev }} \
            -Prealscale_renderer_stack=${{ matrix.renderer_stack }} > fabric-client-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            tail -180 fabric-client-smoke.log || true
            exit "$status"
          fi
          grep -F '${{ matrix.expected_marker }}' fabric-client-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fabric-client-compatibility-${{ matrix.name }}
          path: fabric-client-smoke.log
          if-no-files-found: ignore
