name: Cinematic macro terrain dedicated server generation
# Keep only the newest PR validation; old experimental commits must not
# monopolize expensive high-ceiling Minecraft server runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - '.github/workflows/cinematic-macro-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinematic-macro-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Render archived v1-v2 and ten new v3 north terrain preview PNGs
        working-directory: neoforge
        run: |
          mkdir -p build/cinematic-preview/classes build/cinematic-preview/maps
          javac -d build/cinematic-preview/classes \
            src/main/java/org/realscale/neoforge/CinematicLandformMath.java \
            src/test/java/org/realscale/neoforge/CinematicLandformPreview.java
          java -Djava.awt.headless=true -cp build/cinematic-preview/classes \
            org.realscale.neoforge.CinematicLandformPreview build/cinematic-preview/maps
          test "$(find build/cinematic-preview/maps -name '*.png' | wc -l)" -eq 6
          mkdir -p build/cinematic-preview/v2
          javac -d build/cinematic-preview/classes \
            src/main/java/org/realscale/neoforge/CinematicLandformMath.java \
            src/main/java/org/realscale/neoforge/CinematicLandformMathV2.java \
            src/test/java/org/realscale/neoforge/CinematicLandformPreviewV2.java
          java -Djava.awt.headless=true -cp build/cinematic-preview/classes \
            org.realscale.neoforge.CinematicLandformPreviewV2 build/cinematic-preview/v2
          test "$(find build/cinematic-preview/v2 -name '*.png' | wc -l)" -eq 8
          mkdir -p build/cinematic-preview/v3
          javac -d build/cinematic-preview/classes \
            src/main/java/org/realscale/neoforge/CinematicLandformMath.java \
            src/main/java/org/realscale/neoforge/CinematicLandformMathV2.java \
            src/main/java/org/realscale/neoforge/CinematicLandformMathV3.java \
            src/test/java/org/realscale/neoforge/CinematicLandformPreviewV3.java
          java -Djava.awt.headless=true -cp build/cinematic-preview/classes \
            org.realscale.neoforge.CinematicLandformPreviewV3 build/cinematic-preview/v3
          test "$(find build/cinematic-preview/v3 -name '*.png' | wc -l)" -eq 10
      - name: Prepare a player Natural Exploration world
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=cinematic-macro-test
          level-type=realscale:tva_sacred_biodiversity_end3_spawn3_v3
          level-seed=785312
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          PROPERTIES
          done
      - name: Boot player cinematic terrain and persist a truly generated chunk
        working-directory: neoforge
        run: |
          python3 - <<'PY'
          import subprocess,threading,time,os,signal,gzip,pathlib
          logfile=pathlib.Path('build/cinematic-macro-server.log')
          logfile.parent.mkdir(exist_ok=True,parents=True)
          p=subprocess.Popen(['gradle','--no-daemon','runServer','--stacktrace'],stdin=subprocess.PIPE,
                             stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1,
                             start_new_session=True)
          lines=[];ready=threading.Event()
          def read():
            for line in p.stdout:
              lines.append(line)
              if 'Done (' in line and 'For help' in line:ready.set()
          t=threading.Thread(target=read,daemon=True);t.start()
          deadline=time.time()+420
          while time.time()<deadline and p.poll() is None and not ready.is_set():time.sleep(1)
          if ready.is_set():
            p.stdin.write('forceload add 2048 2048\n');p.stdin.flush()
            time.sleep(45)
          try:
            if p.poll() is None:
              p.stdin.write('stop\n');p.stdin.flush();p.wait(timeout=50)
          except Exception:
            if p.poll() is None:
              os.killpg(p.pid,signal.SIGINT)
              try:p.wait(timeout=15)
              except subprocess.TimeoutExpired:
                os.killpg(p.pid,signal.SIGKILL);p.wait()
          t.join(timeout=3)
          logfile.write_text(''.join(lines))
          print('server_boot_ready',ready.is_set(),'output_tail',logfile.read_text()[-9000:])
          found=False
          for path in pathlib.Path('run').glob('**/level.dat'):
            data=gzip.decompress(path.read_bytes())
            print('LEVEL_METADATA',path,
                  'versioned_noise',b'realscale:tva_cinematic_landforms_v3' in data,
                  'real_ecology',b'realscale:sky_ocean' in data)
            if b'realscale:tva_cinematic_landforms_v3' in data and b'realscale:sky_ocean' in data:
              print('CINEMATIC_MACRO_SETTINGS_PERSISTED',path)
              found=True
          if not ready.is_set() or not found:
            raise SystemExit('FAIL: cinematic preset did not boot into a persisted new world')
          print('PASS: cinematic codec registry decode, persistent player world and macro profile')
          PY
      - name: Verify real Anvil chunk records were generated
        working-directory: neoforge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          regions=list(Path("run/cinematic-macro-test/region").glob("r.*.*.mca"))
          count=0
          for region in regions:
            with region.open("rb") as stream: offsets=stream.read(4096)
            count+=sum(any(offsets[i:i+4]) for i in range(0,len(offsets),4))
          print("CINEMATIC_REGION_COUNT",len(regions),"ANVIL_CHUNKS",count)
          if count<1:raise SystemExit("No persisted cinematic new-world Anvil chunks")
          PY
      - name: Upload cinematic macro world diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cinematic-macro-world-log
          path: |
            neoforge/build/cinematic-macro-server.log
            neoforge/build/cinematic-preview/maps/*.png
            neoforge/build/cinematic-preview/v2/*.png
            neoforge/build/cinematic-preview/v3/*.png
            neoforge/run/**/cinematic-macro-test/level.dat
            neoforge/run/**/cinematic-macro-test/region/*.mca
          if-no-files-found: warn
