name: Cave Exploration experimental saved-world generation
on:
  pull_request:
    paths:
      - 'neoforge/src/main/java/org/realscale/neoforge/GrandOverworldCaveDesignV2.java'
      - 'neoforge/src/main/java/org/realscale/neoforge/GrandOverworldCaverns.java'
      - 'neoforge/src/main/resources/data/realscale/worldgen/noise_settings/tva_cave_exploration.json'
      - 'neoforge/src/main/resources/data/realscale/worldgen/world_preset/cave_exploration_three_realms.json'
      - 'qa/neoforge/cave_exploration_world_boot.py'
      - '.github/workflows/cave-exploration-world.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cave-exploration-anvil:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Boot separate Cave Exploration world and persist real FULL chunk
        run: python3 qa/neoforge/cave_exploration_world_boot.py
      - name: Preserve server boot and Anvil codec evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RealScale-Cave-Exploration-V2-Saved-World
          path: |
            neoforge/build/cave-exploration-v2-server.log
            neoforge/build/cave-exploration-v2-anvil-report.json
            neoforge/run/**/cave-exploration-v2/level.dat
            neoforge/run/**/cave-exploration-v2/region/*.mca
          if-no-files-found: warn
