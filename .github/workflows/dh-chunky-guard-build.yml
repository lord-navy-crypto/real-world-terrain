name: EXPERIMENT build isolated DH Chunky crash guard JAR
on:
  push:
    branches: [experiment/realscale-dh-chunky-iris-sodium-bridge-20261023]
    paths:
      - "dh-chunky-guard/**"
      - "qa/test_dh_chunky_patch.py"
      - ".github/workflows/dh-chunky-guard-build.yml"
  pull_request:
    paths:
      - "dh-chunky-guard/**"
      - "qa/test_dh_chunky_patch.py"
      - ".github/workflows/dh-chunky-guard-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Run patch safety, version and targeted-injection tests
        run: |
          python3 -m unittest discover -s qa -p test_dh_chunky_patch.py -v
          python3 -m unittest discover -s qa -p test_dh_chunky_runtime.py -v
          python3 -m unittest discover -s qa -p test_realscale_dh_client_safety.py -v
          python3 -m unittest discover -s qa -p test_lod_stack_audit.py -v
      - name: Build tiny self-contained NeoForge patch JAR
        working-directory: dh-chunky-guard
        run: gradle --no-daemon --stacktrace build
      - name: Verify only own Mixin and metadata are shipped
        run: |
          python3 - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          jars=glob("dh-chunky-guard/build/libs/*.jar")
          assert len(jars)==1, jars
          with ZipFile(jars[0]) as z:
            names=set(z.namelist())
            assert "META-INF/neoforge.mods.toml" in names
            assert "dhchunkyguard.mixins.json" in names
            assert "org/realscale/compat/dhchunky/mixin/ChunkyLifecycleSetupMixin.class" in names
            assert not any(x.startswith("org/popcraft/") or x.startswith("com/seibel/") for x in names)
          print("DH_CHUNKY_GUARD_PATCH_JAR_VALID",jars[0])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RealScale-DH-Chunky-Guard-EXPERIMENTAL-NeoForge-1.21.1
          path: dh-chunky-guard/build/libs/RealScale-DH-Chunky-Guard-NeoForge-1.21.1-0.2.0-experimental.jar
          if-no-files-found: error
