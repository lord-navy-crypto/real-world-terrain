name: USGS Big Sur legacy versus v2 multi-seed and four-edge Anvil QA
on:
  push:
    branches: [main]
    paths: ['neoforge/**', 'qa/neoforge/**', '.github/workflows/usgs-bigsur-v2-server.yml']
  pull_request:
    paths: ['neoforge/**', 'qa/neoforge/**', '.github/workflows/usgs-bigsur-v2-server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neoforge-worldgen:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        preset: [usgs_big_sur, usgs_big_sur_v2]
        seed: [785312, 20261012]
    name: ${{ matrix.preset }} / seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare EULA and actual world type
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=world
          level-type=realscale:${{ matrix.preset }}
          level-seed=${{ matrix.seed }}
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          server-ip=127.0.0.1
          enable-rcon=true
          rcon.port=25575
          rcon.password=realscale_ci_probe_only
          PROPERTIES
          done
      - name: Boot real NeoForge and load distant chunks with authenticated RCON
        working-directory: neoforge
        run: python3 ../qa/neoforge/rcon_worldgen_smoke.py . 'realscale:${{ matrix.preset }}' usgs
      - name: Verify ACTUAL legacy USGS DEM center against source data
        if: matrix.preset == 'usgs_big_sur'
        working-directory: neoforge
        run: python3 ../qa/neoforge/check_actual_chunk_heights.py .
      - name: Verify ACTUAL seamless USGS v2 samples on every tile edge
        if: matrix.preset == 'usgs_big_sur_v2'
        working-directory: neoforge
        run: python3 ../qa/neoforge/check_usgs_v2_edges.py .
      - name: Upload server diagnostics and generated world metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RealScale-${{ matrix.preset }}-Seed-${{ matrix.seed }}-DEM-Comparison
          path: |
            neoforge/usgs_v2_edge_qa.json
            neoforge/real_dem_anvil_qa.json
            neoforge/build/rcon_usgs_server.log
            neoforge/run/**/level.dat
            neoforge/run/**/region/*.mca
            neoforge/run/**/logs/latest.log
          if-no-files-found: warn
