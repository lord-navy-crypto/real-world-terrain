name: RealScale natural three-realm worldgen regression
# Keep only the newest PR validation; old experimental commits must not
# monopolize expensive high-ceiling Minecraft server runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - '.github/workflows/tva-sacred-world.yml'
      - 'qa/neoforge/rcon_worldgen_smoke.py'
      - 'qa/neoforge/audit_dh_lod_sqlite.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tva-sacred-preset-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare an isolated ecotone world
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=tva-sacred-test
          level-type=realscale:tva_sacred_timeline_three_realms
          level-seed=2
          server-ip=127.0.0.1
          enable-rcon=true
          rcon.port=25575
          rcon.password=realscale_ci_probe_only
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          PROPERTIES
          done
      - name: Boot NeoForge and generate distant chunks via authenticated RCON
        working-directory: neoforge
        run: python3 ../qa/neoforge/rcon_worldgen_smoke.py . 'realscale:tva_sacred_timeline_three_realms' distant
      - name: Verify persisted TVA three-realm source chain
        working-directory: neoforge
        run: |
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          level = Path("run/tva-sacred-test/level.dat")
          if not level.is_file():
              raise SystemExit("FAIL: TVA level.dat was not persisted")
          data = gzip.decompress(level.read_bytes())
          required = (
              b"realscale:sky_ocean",
              b"realscale:natural_ecotones",
              b"realscale:grand_nether",
              b"realscale:grand_end",
          )
          missing = [token.decode() for token in required if token not in data]
          if missing:
              raise SystemExit("FAIL: persisted TVA source chain missing " + str(missing))
          print("TVA_SACRED_PRESET_PERSISTED", level)
          print("PASS: sky/ocean, natural ecotones and both Grand dimensions")
          PY
      - name: Check Anvil chunk palettes for actual climate-boundary ecotone selections
        working-directory: neoforge
        run: python3 ../qa/neoforge/check_ecotone_biomes.py run/tva-sacred-test
      - name: Upload ecotone test diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TVA-Sacred-Three-Realm-Server-Proof
          path: |
            neoforge/build/rcon_distant_server.log
            neoforge/build/dh-chunky-lod-storage.json
            neoforge/build/ecotone-anvil-qa.json
            neoforge/run/tva-sacred-test/level.dat
            neoforge/run/tva-sacred-test/region/*.mca
          if-no-files-found: warn
