name: Unified invasion real-spawn proof (Sacred and Measured)
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - 'scripts/unified_world_settings.py'
      - 'scripts/export_terrain_lab_datapack.py'
      - 'qa/neoforge/unified_invasion_spawn_boot.py'
      - '.github/workflows/unified-invasion-spawn.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  first-spawn-biome:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        base: [sacred, measured]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build mod for matching exported world profile
        run: cd neoforge && gradle --no-daemon build
      - name: Test actual first-world spawn biome and save via NeoForge
        env:
          REALSCALE_UNIFIED_SPAWN_BASE: ${{ matrix.base }}
        run: python3 qa/neoforge/unified_invasion_spawn_boot.py
      - name: Preserve saved origin world and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVA-Unified-Spawn-${{ matrix.base }}-Proof
          path: |
            neoforge/build/unified-invasion-spawn-*.log
            neoforge/run/**/unified-invasion-spawn-${{ matrix.base }}/level.dat
            neoforge/run/**/unified-invasion-spawn-${{ matrix.base }}/region/*.mca
          if-no-files-found: warn
