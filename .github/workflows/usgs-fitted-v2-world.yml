name: USGS fully fitted V2 real world and Anvil proof
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - 'qa/test_usgs_fitted_full_v2.py'
      - '.github/workflows/usgs-fitted-v2-world.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: usgs-fitted-world-v2
  cancel-in-progress: true
jobs:
  fitted-usgs-world:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prove DEM-fitting math from actual USGS samples
        run: python3 -m unittest discover -s qa -p 'test_usgs_fitted_full_v2.py' -v
      - name: Build complete NeoForge mod
        working-directory: neoforge
        run: gradle --no-daemon build
      - name: Create a genuinely USGS-fitted Minecraft world
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'SETTINGS'
          level-name=usgs-fitted-v2-world
          level-type=realscale:tva_measured_usgs_fitted_v2_three_realms
          level-seed=785312
          max-tick-time=-1
          spawn-protection=0
          simulation-distance=3
          view-distance=3
          online-mode=true
          SETTINGS
          done
      - name: Boot server and prove a far-distance generated chunk
        working-directory: neoforge
        run: |
          python3 - <<'PY'
          import subprocess,threading,time,pathlib,os,signal,gzip
          logfile=pathlib.Path('build/usgs-fitted-v2-world.log')
          logfile.parent.mkdir(parents=True,exist_ok=True)
          p=subprocess.Popen(['gradle','--no-daemon','runServer','--stacktrace'],
               stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,
               text=True,bufsize=1,start_new_session=True)
          lines=[];ready=threading.Event()
          def read():
              for line in p.stdout:
                  lines.append(line)
                  if 'Done (' in line and 'For help' in line:ready.set()
          t=threading.Thread(target=read,daemon=True);t.start()
          try:
              limit=time.monotonic()+500
              while p.poll() is None and not ready.is_set() and time.monotonic()<limit:time.sleep(1)
              if not ready.is_set():raise RuntimeError('USGS fitted Minecraft server did not boot')
              p.stdin.write('forceload add 2048 0\n');p.stdin.flush()
              time.sleep(65)
              p.stdin.write('save-all flush\n');p.stdin.flush()
              time.sleep(7)
              p.stdin.write('stop\n');p.stdin.flush()
              p.wait(timeout=100)
          finally:
              if p.poll() is None:
                  os.killpg(p.pid,signal.SIGINT)
                  try:p.wait(timeout=12)
                  except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL);p.wait()
              t.join(timeout=3)
              logfile.write_text(''.join(lines),encoding='utf-8')
              print('USGS_FITTED_SERVER_READY',ready.is_set(),'LOG_TAIL',logfile.read_text()[-6000:])
          saved=list(pathlib.Path('run').glob('**/usgs-fitted-v2-world/level.dat'))
          assert saved,'No Minecraft saved world'
          assert b'realscale:usgs_fitted_continuation_v2' in gzip.decompress(saved[0].read_bytes()),'Wrong terrain profile'
          regions=list(pathlib.Path('run').glob('**/usgs-fitted-v2-world/region/r.*.*.mca'))
          total=0;far=False
          for region in regions:
              with region.open('rb') as f:header=f.read(4096)
              n=sum(any(header[i:i+4]) for i in range(0,len(header),4))
              total+=n
              if region.name=='r.4.0.mca' and n>0:far=True
          print('USGS_FITTED_ANVIL_CHUNKS',total,'2048_FAR_REGION',far)
          assert total>0 and far,'Distant region must be physically saved, not only ticket ACK'
          print('USGS_FITTED_V2_REAL_SERVER_PASS')
          PY
      - name: Upload real-world diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: USGS-Fitted-v2-Real-Minecraft-World
          path: |
            neoforge/build/usgs-fitted-v2-world.log
            neoforge/run/**/usgs-fitted-v2-world/level.dat
            neoforge/run/**/usgs-fitted-v2-world/region/r.*.*.mca
          if-no-files-found: warn
