name: USGS fully fitted V2 real world and Anvil proof
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - 'qa/test_usgs_fitted_full_v2.py'
      - '.github/workflows/usgs-fitted-v2-world.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: usgs-fitted-world-v2
  cancel-in-progress: true
jobs:
  fitted-usgs-world:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prove DEM-fitting math from actual USGS samples
        run: python3 -m unittest discover -s qa -p 'test_usgs_fitted_full_v2.py' -v
      - name: Build complete NeoForge mod
        working-directory: neoforge
        run: gradle --no-daemon build
      - name: Create a genuinely USGS-fitted Minecraft world
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'SETTINGS'
          level-name=usgs-fitted-v2-world
          level-type=realscale:tva_measured_usgs_fitted_v2_three_realms
          level-seed=785312
          max-tick-time=-1
          spawn-protection=0
          simulation-distance=3
          view-distance=3
          online-mode=true
          enable-rcon=true
          rcon.password=realscale_fitted_v2_ci_only
          rcon.port=25575
          SETTINGS
          done
      - name: RCON-authenticated far chunk, saved Anvil proof, and latency profile
        working-directory: neoforge
        timeout-minutes: 13
        env:
          JAVA_TOOL_OPTIONS: "-Drealscale.density.profile=true"
        run: python3 ../qa/neoforge/usgs_fitted_far_chunk_probe.py
      - name: Upload real-world diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: USGS-Fitted-v2-Real-Minecraft-World
          path: |
            neoforge/build/usgs-fitted-v2-world.log
            neoforge/build/usgs-fitted-v2-perf-report.json
            neoforge/build/usgs-fitted-v2-thread-dump.txt
            neoforge/run/**/usgs-fitted-v2-world/level.dat
            neoforge/run/**/usgs-fitted-v2-world/region/r.*.*.mca
          if-no-files-found: warn
