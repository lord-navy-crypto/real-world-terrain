name: RealScale experimental Nether and End expansion smoke QA
on:
  pull_request:
    paths: ['neoforge/**', 'scripts/terrain_lab.py', 'qa/test_terrain_lab.py', '.github/workflows/fantasy-dimensions-server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fantasy-dimensions:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Generate opt-in fantasy dimensions world preset
        run: |
          set -euo pipefail
          lab_id=$(python3 scripts/terrain_lab.py --preset landscape --profile natural --caves 50 --fantasy-dimensions | sed -n 's/^Prepared world type: //p')
          test -n "$lab_id"
          echo "LAB_WORLD=$lab_id" >> "$GITHUB_ENV"
          python3 -m unittest discover -s qa -p 'test_terrain_lab.py' -v
      - name: Prepare clean dedicated server world
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<PROPERTIES
          level-name=world
          level-type=${LAB_WORLD}
          level-seed=785312
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-tick-time=-1
          online-mode=false
          server-ip=127.0.0.1
          enable-rcon=true
          rcon.port=25575
          rcon.password=realscale_ci_probe_only
          PROPERTIES
          done
      - name: Boot real NeoForge server and force-load Nether and End using RCON
        working-directory: neoforge
        run: python3 ../qa/neoforge/rcon_worldgen_smoke.py . "$LAB_WORLD" fantasy
      - name: Inspect saved Anvil vertical cave bands and outer sky islands
        working-directory: neoforge
        run: python3 ../qa/neoforge/audit_fantasy_dimensions.py .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fantasy-Dimensions-Server-QA
          path: |
            neoforge/build/rcon_fantasy_server.log
            neoforge/fantasy_dimensions_anvil_qa.json
            neoforge/run/**/DIM-1/region/*.mca
            neoforge/run/**/DIM1/region/*.mca
            neoforge/run/**/logs/latest.log
          if-no-files-found: warn
