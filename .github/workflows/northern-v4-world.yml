name: Northern v4 caves sky and fjord real server proof
# Keep only the newest PR validation; old experimental commits must not
# monopolize expensive high-ceiling Minecraft server runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - '.github/workflows/northern-v4-world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  northern-v4-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Verify the actual experimental v4 Java mathematics and wiring
        run: |
          python3 -m unittest discover -s qa -p 'test_coastal_fjord_v4.py' -v
          python3 -m unittest discover -s qa -p 'test_northern_caves_sky_v4.py' -v
      - name: Prepare an isolated northern v4 experimental world
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=northern-v4-experiment
          level-type=realscale:tva_northern_fjord_experiment_v4_three_realms
          level-seed=785312
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          PROPERTIES
          done
      - name: Boot player cinematic terrain and persist a truly generated chunk
        working-directory: neoforge
        run: |
          python3 - <<'PY'
          import subprocess,threading,time,os,signal,gzip,pathlib
          logfile=pathlib.Path('build/cinematic-macro-server.log')
          logfile.parent.mkdir(exist_ok=True,parents=True)
          p=subprocess.Popen(['gradle','--no-daemon','runServer','--stacktrace'],stdin=subprocess.PIPE,
                             stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1,
                             start_new_session=True)
          lines=[];ready=threading.Event()
          def read():
            for line in p.stdout:
              lines.append(line)
              if 'Done (' in line and 'For help' in line:ready.set()
          t=threading.Thread(target=read,daemon=True);t.start()
          deadline=time.time()+420
          while time.time()<deadline and p.poll() is None and not ready.is_set():time.sleep(1)
          if ready.is_set():
            p.stdin.write('forceload add 2048 2048\n');p.stdin.flush()
            time.sleep(45)
          try:
            if p.poll() is None:
              p.stdin.write('stop\n');p.stdin.flush();p.wait(timeout=50)
          except Exception:
            if p.poll() is None:
              os.killpg(p.pid,signal.SIGINT)
              try:p.wait(timeout=15)
              except subprocess.TimeoutExpired:
                os.killpg(p.pid,signal.SIGKILL);p.wait()
          t.join(timeout=3)
          logfile.write_text(''.join(lines))
          log=logfile.read_text()
          print('server_boot_ready',ready.is_set(),'output_tail',log[-14000:])
          if not ready.is_set():
            for key in ('FAILURE:', 'Caused by:', 'Exception', 'error:'):
              start=log.find(key)
              if start>=0: print('BOOT_FAILURE_DIAGNOSTIC',key,log[max(0,start-500):start+1700])
          found=False
          for path in pathlib.Path('run').glob('**/level.dat'):
            data=gzip.decompress(path.read_bytes())
            print('LEVEL_METADATA',path,
                  'versioned_noise',b'realscale:tva_cinematic_landforms_v4' in data,
                  'real_ecology',b'realscale:sky_ocean' in data,
                  'cave_biomes',b'realscale:northern_cave_biomes_v4' in data)
            if (b'realscale:tva_cinematic_landforms_v4' in data
                and b'realscale:sky_ocean' in data
                and b'realscale:northern_cave_biomes_v4' in data):
              print('NORTHERN_V4_SETTINGS_PERSISTED',path)
              found=True
          if not ready.is_set() or not found:
            raise SystemExit('FAIL: northern v4 experimental profile failed to boot')
          print('PASS: experimental v4 codec, cave biomes, sky generator persisted')
          PY
      - name: Verify real Anvil chunk records were generated
        working-directory: neoforge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          regions=list(Path("run/northern-v4-experiment/region").glob("r.*.*.mca"))
          count=0
          for region in regions:
            with region.open("rb") as stream: offsets=stream.read(4096)
            count+=sum(any(offsets[i:i+4]) for i in range(0,len(offsets),4))
          print("NORTHERN_V4_REGION_COUNT",len(regions),"ANVIL_CHUNKS",count)
          if count<1:raise SystemExit("No persisted northern v4 Anvil chunks")
          PY
      - name: Upload northern v4 actual server diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Northern-v4-server-log
          path: |
            neoforge/build/cinematic-macro-server.log
            neoforge/src/main/java/org/realscale/neoforge/RealScaleCinematicIntegrated.java
            neoforge/run/**/northern-v4-experiment/level.dat
            neoforge/run/**/northern-v4-experiment/region/*.mca
          if-no-files-found: warn
