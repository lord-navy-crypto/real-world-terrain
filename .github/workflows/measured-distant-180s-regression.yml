name: Measured distant chunk 180s regression (seed 2 and 42)
on:
  push:
    branches: [main]
    paths:
      - 'neoforge/build.gradle'
      - 'neoforge/src/main/java/org/realscale/neoforge/**'
      - 'neoforge/src/main/resources/data/realscale/worldgen/**'
      - 'qa/neoforge/rcon_worldgen_smoke.py'
      - '.github/workflows/measured-distant-180s-regression.yml'
  pull_request:
    paths:
      - 'neoforge/src/main/java/org/realscale/neoforge/MeasuredHorizontalMemoDensity.java'
      - 'neoforge/src/main/java/org/realscale/neoforge/TerrainArchetypeMath.java'
      - 'neoforge/src/main/java/org/realscale/neoforge/TerrainArchetypeDensity.java'
      - 'neoforge/src/main/resources/data/realscale/worldgen/density_function/tva_volcanic_fitted/**'
      - 'neoforge/src/main/resources/data/realscale/worldgen/noise_settings/tva_volcanic_fitted.json'
      - 'neoforge/src/main/resources/data/realscale/worldgen/world_preset/volcanic_three_realms.json'
      - 'neoforge/src/main/java/org/realscale/neoforge/GrandOverworldCaveNetwork.java'
      - 'neoforge/src/main/java/org/realscale/neoforge/RealDemSeamlessMath.java'
      - 'neoforge/src/test/java/org/realscale/neoforge/GrandOverworldCaveNetworkSmoke.java'
      - 'neoforge/src/test/java/org/realscale/neoforge/RealDemSeamlessMathSmoke.java'
      - 'neoforge/src/main/java/org/realscale/neoforge/RealScaleMod.java'
      - 'neoforge/src/main/resources/data/realscale/worldgen/density_function/usgs_big_sur_v2/**'
      - 'neoforge/src/main/resources/data/realscale/worldgen/density_function/realism_max/**'
      - 'qa/neoforge/rcon_worldgen_smoke.py'
      - '.github/workflows/measured-distant-180s-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: measured-180-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measured:
    name: Measured real NeoForge seed ${{ matrix.seed }} / strict 180s
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [2, 42]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare unchanged real-server terrain baseline
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=world
          level-type=realscale:tva_measured_three_realms
          level-seed=${{ matrix.seed }}
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          server-ip=127.0.0.1
          enable-rcon=true
          rcon.port=25575
          rcon.password=realscale_ci_probe_only
          PROPERTIES
          done
      - name: Full server 180-second far-chunk load and ACK test
        working-directory: neoforge
        run: python3 ../qa/neoforge/rcon_worldgen_smoke.py . 'realscale:tva_measured_three_realms' distant
      - name: Verify actual persisted ground and cave continuity
        working-directory: neoforge
        run: python3 ../qa/neoforge/check_realism_continuity.py . 'tva_measured_three_realms'
      - name: Preserve real worldgen failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Measured-FarChunk-Seed-${{ matrix.seed }}-strict-180s
          path: |
            neoforge/realism_continuity_qa.json
            neoforge/build/rcon_distant_server.log
            neoforge/build/rcon_distant_thread_dump_*.txt
            neoforge/build/rcon_distant_stall_fingerprint.json
            neoforge/run/**/level.dat
            neoforge/run/**/region/*.mca
          if-no-files-found: warn
  volcanic-hawaii:
    name: Hawaii volcanic real chunk / JFR / strict 180s
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REALSCALE_JFR_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare isolated Hawaii volcanic world
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=world
          level-type=realscale:volcanic_three_realms
          level-seed=42
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          server-ip=127.0.0.1
          enable-rcon=true
          rcon.port=25575
          rcon.password=realscale_ci_probe_only
          PROPERTIES
          done
      - name: Generate and verify one distant Hawaii chunk within 180 seconds
        working-directory: neoforge
        run: python3 ../qa/neoforge/rcon_worldgen_smoke.py . 'realscale:volcanic_three_realms' distant
      - name: Summarize sampled CPU stacks for Hawaii volcanic worldgen
        if: success()
        run: python3 qa/neoforge/summarize_worldgen_jfr.py neoforge/build/realscale_worldgen_cpu.jfr build/realscale_hawaii_volcanic_jfr_report.json
      - name: Preserve Hawaii generation timing, JFR, and stall evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-Hawaii-Volcanic-Worldgen-JFR
          path: |
            neoforge/build/realscale_worldgen_cpu.jfr
            build/realscale_hawaii_volcanic_jfr_report.json
            neoforge/build/rcon_distant_server.log
            neoforge/build/rcon_distant_thread_dump_*.txt
            neoforge/build/rcon_distant_stall_fingerprint.json
            neoforge/build/dh-chunky-lod-storage.json
            neoforge/run/**/level.dat
            neoforge/run/**/region/*.mca
          if-no-files-found: warn
