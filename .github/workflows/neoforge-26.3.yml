name: RealScale NeoForge 26.3 Port
on:
  push:
    paths: ["neoforge-26.3/**", ".github/workflows/neoforge-26.3.yml"]
  pull_request:
    paths: ["neoforge-26.3/**", ".github/workflows/neoforge-26.3.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - run: gradle --no-daemon -p neoforge-26.3 clean build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RealScale-NeoForge-26.3
          path: neoforge-26.3/build/libs/*.jar
          if-no-files-found: error
