name: Build current independent DH-Chunky Guard JAR
on:
  push:
    branches:
      - 'test/public-eight-presets-natural-usgs-20261027'
    paths:
      - '.github/workflows/dh-chunky-guard-current-jar.yml'
      - 'dh-chunky-guard/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-current-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile independent DH-Chunky Guard
        working-directory: dh-chunky-guard
        run: gradle --no-daemon --stacktrace build
      - name: Audit the standalone playable JAR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jars = list(Path('dh-chunky-guard/build/libs').glob('RealScale-DH-Chunky-Guard-NeoForge-1.21.1-*.jar'))
          jars = [p for p in jars if not p.name.endswith('-sources.jar')]
          if len(jars) != 1:
              raise SystemExit(f'Expected exactly one binary addon JAR, got {jars}')
          with ZipFile(jars[0]) as z:
              entries=set(z.namelist())
              for required in (
                  'META-INF/neoforge.mods.toml',
                  'dhchunkyguard.mixins.json',
                  'org/realscale/compat/dhchunky/DhChunkyGuardMod.class',
                  'org/realscale/compat/dhchunky/ChunkyBridgeMetrics.class',
                  'org/realscale/compat/dhchunky/mixin/ChunkyLifecycleSetupMixin.class',
              ):
                  if required not in entries:
                      raise SystemExit(f'Missing compatibility addon component: {required}')
              if any(n.startswith('org/popcraft/') or n.startswith('com/seibel/') for n in entries):
                  raise SystemExit('Bundled third-party DH or Chunky internals')
              metadata=z.read('META-INF/neoforge.mods.toml')
              if b'modId="dhchunkyguard"' not in metadata:
                  raise SystemExit('Wrong addon ID')
          print('CURRENT_DH_CHUNKY_GUARD_JAR_OK',jars[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RealScale-DH-Chunky-Guard-Latest-Standalone-JAR
          path: dh-chunky-guard/build/libs/RealScale-DH-Chunky-Guard-NeoForge-1.21.1-*.jar
          if-no-files-found: error
          retention-days: 7
