name: RealScale Modern Cities Urban Districts Server Acceptance

on:
  pull_request:
    paths:
      - 'scripts/generate_urban_districts.py'
      - 'scripts/urban_district_profiles.json'
      - 'neoforge/build.gradle'
      - 'neoforge/src/main/java/org/realscale/neoforge/RealScaleStructurePacks.java'
      - 'neoforge/src/main/java/org/realscale/neoforge/RealScaleTerrainLabClient.java'
      - 'qa/test_urban_districts.py'
      - 'qa/neoforge/urban_city_server_boot.py'
      - '.github/workflows/urban-districts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realscale-urban-${{ github.ref }}
  cancel-in-progress: true

jobs:
  city-quarters:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build original city NBT and the full NeoForge 1.21.1 JAR
        working-directory: neoforge
        run: gradle --no-daemon --stacktrace build
      - name: Verify all four urban districts and independent pack/biome contract
        run: python3 -m unittest discover -s qa -p 'test_urban_districts.py' -v
      - name: Verify 100 previously accepted structures are still untouched
        run: python3 -m unittest discover -s qa -p 'test_architecture_pilot_pack.py' -v
      - name: Boot RealScale natural world, place four real districts and inspect persisted Anvil roofs
        run: python3 qa/neoforge/urban_city_server_boot.py
      - name: Upload urban test JAR and real server/Anvil evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-Urban-City-Blocks-NeoForge-1.21.1
          path: |
            neoforge/build/libs/*.jar
            neoforge/build/urban-city-server.log
            neoforge/build/urban-city-anvil-report.json
          if-no-files-found: warn
          retention-days: 30
