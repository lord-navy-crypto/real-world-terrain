name: EXPERIMENT JFR Perlin / Beardifier / Aquifer baseline 2096
on:
  push:
    branches: [experiment/vanilla-perlin-exact-memo]
    paths:
      - '.github/workflows/worldgen-jfr-hotspots.yml'
      - 'qa/neoforge/summarize_worldgen_jfr.py'
      - 'qa/neoforge/classify_vanilla_jfr_hotspots.py'
      - 'qa/test_classify_vanilla_jfr_hotspots.py'
      - 'qa/neoforge/rcon_worldgen_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-original-vanilla:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: tva_measured_three_realms
            seed: 2
          - preset: tva_sacred_timeline_three_realms
            seed: 42
    env:
      REALSCALE_JFR_DIAGNOSTIC: '1'
      PRESET: ${{ matrix.preset }}
      SEED: ${{ matrix.seed }}
      JAVA_TOOL_OPTIONS: -Drealscale.experimental.perlin.instrument=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare full-height ORIGINAL VANILLA world, all structures enabled
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=world
          level-type=realscale:$PRESET
          level-seed=$SEED
          generate-structures=true
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          server-ip=127.0.0.1
          enable-rcon=true
          rcon.port=25575
          rcon.password=realscale_ci_probe_only
          PROPERTIES
          done
      - name: Record CPU samples across three distant complete chunk loads
        working-directory: neoforge
        run: python3 ../qa/neoforge/rcon_worldgen_smoke.py . "realscale:$PRESET" distant_route
      - name: Summarize CPU execution stacks and identify expensive call chains
        run: python3 qa/neoforge/summarize_worldgen_jfr.py neoforge/build/realscale_worldgen_cpu.jfr build/realscale_jfr_report.json
      - name: Separate Perlin / Beardifier / Aquifer JFR execution samples
        run: |
          python3 -m unittest discover -s qa -p 'test_classify_vanilla_jfr_hotspots.py' -v
          python3 qa/neoforge/classify_vanilla_jfr_hotspots.py \
            neoforge/build/realscale_worldgen_cpu.jfr \
            build/realscale-vanilla-three-hotspots.json
      - name: Preserve raw flamegraph-compatible recording and Anvil evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Original-Perlin-Beardifier-Aquifer-JFR-${{ matrix.preset }}
          path: |
            neoforge/build/realscale_worldgen_cpu.jfr
            build/realscale_jfr_report.json
            build/realscale-vanilla-three-hotspots.json
            neoforge/build/rcon_distant_route_timing.json
            neoforge/build/rcon_distant_route_server.log
          if-no-files-found: warn
