name: Source integrity, tests and NeoForge build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify recovered source, artifacts and actual saved world
        run: python3 qa/verify_repository.py
      - name: Validate custom biome registry resources (static)
        run: python3 scripts/check_custom_biomes.py
      - name: Validate Grand Ecology registrations and preserved dimensions
        run: python3 scripts/check_grand_ecology.py
      - name: Compile and execute ecotone and cave classifier smoke tests
        run: |
          mkdir -p build/habitat-smoke
          javac -d build/habitat-smoke \
            neoforge/src/main/java/org/realscale/neoforge/EcotoneMath.java \
            neoforge/src/main/java/org/realscale/neoforge/CaveHabitatMath.java \
            neoforge/src/test/java/org/realscale/neoforge/HabitatMathSmoke.java
          java -cp build/habitat-smoke org.realscale.neoforge.HabitatMathSmoke
      - name: Measure DEM grid continuity and tile boundary blend
        run: |
          mkdir -p build/terrain-continuity
          javac -d build/terrain-continuity \
            neoforge/src/main/java/org/realscale/neoforge/RealDemTile.java \
            neoforge/src/test/java/org/realscale/neoforge/TerrainContinuitySmoke.java
          java -cp build/terrain-continuity:neoforge/src/main/resources org.realscale.neoforge.TerrainContinuitySmoke
      - name: Grand Nether / End math determinism and dragon island protection
        run: |
          mkdir -p build/grand-dimension-smoke
          javac -d build/grand-dimension-smoke \
            neoforge/src/main/java/org/realscale/neoforge/GrandDimensionMath.java \
            neoforge/src/test/java/org/realscale/neoforge/GrandDimensionMathSmoke.java
          java -cp build/grand-dimension-smoke org.realscale.neoforge.GrandDimensionMathSmoke
      - name: Validate giant connected Grand Nether caverns and roof protection
        run: |
          mkdir -p build/grand-cave-smoke
          javac -d build/grand-cave-smoke \
            neoforge/src/main/java/org/realscale/neoforge/GrandNetherCaveNetwork.java \
            neoforge/src/test/java/org/realscale/neoforge/GrandNetherCaveNetworkSmoke.java
          java -cp build/grand-cave-smoke org.realscale.neoforge.GrandNetherCaveNetworkSmoke
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build readable NeoForge project
        working-directory: neoforge
        run: gradle --no-daemon --stacktrace build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RealScale-NeoForge-build-and-replay
          path: |
            neoforge/build/libs/*.jar
            build/saved-world-replay.json
          if-no-files-found: error
