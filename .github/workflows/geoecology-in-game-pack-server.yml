name: NeoForge actually loads winter ecology and 2x structures datapacks
on:
  pull_request:
    paths:
      - 'scripts/make_geoecology_suite.py'
      - 'scripts/make_vanilla_ecology_pack.py'
      - 'scripts/make_structure_density_packs.py'
      - 'qa/neoforge/rcon_worldgen_smoke.py'
      - '.github/workflows/geoecology-in-game-pack-server.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: realscale-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  boot-actual-opt-in-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build both optional datapacks and validate ZIP files
        run: |
          python3 -m unittest discover -s qa -p 'test_structure_and_geoecology.py' -v
          python3 scripts/make_geoecology_suite.py
          python3 scripts/make_structure_density_packs.py
      - name: Configure NEW disposable NeoForge world with both packs preinstalled
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir/world/datapacks"
            printf 'eula=true\n' > "$dir/eula.txt"
            cp ../build/RealScale-GeoEcology-Winter-EXPERIMENTAL.zip "$dir/world/datapacks/"
            cp ../build/RealScale-Vanilla-Structures-2x-EXPERIMENTAL.zip "$dir/world/datapacks/"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=world
          level-type=minecraft:normal
          level-seed=785312
          generate-structures=true
          initial-enabled-packs=vanilla,file/RealScale-GeoEcology-Winter-EXPERIMENTAL.zip,file/RealScale-Vanilla-Structures-2x-EXPERIMENTAL.zip
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=false
          server-ip=127.0.0.1
          enable-rcon=true
          rcon.port=25575
          rcon.password=realscale_ci_probe_only
          PROPERTIES
          done
      - name: Launch REAL NeoForge server; verify both packs via RCON and saved NBT
        working-directory: neoforge
        run: python3 ../qa/neoforge/rcon_worldgen_smoke.py . 'minecraft:overworld' packs
      - name: Upload server registry, NBT and data pack diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RealScale-GeoEcology-and-2x-Structures-REAL-Server-QA
          if-no-files-found: warn
          path: |
            neoforge/build/rcon_packs_server.log
            neoforge/run/**/level.dat
            neoforge/run/**/logs/latest.log
