name: USGS measured + 24 global landforms real server
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - 'qa/neoforge/usgs_measured_global_hybrid_world_boot.py'
      - '.github/workflows/usgs-measured-global-hybrid-world.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regional-atlas-world:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build USGS measured DEM plus all 24 rare geomorphic enclave shapes
        run: cd neoforge && gradle --no-daemon build
      - name: Boot actual regional atlas, verify all End spawn modes and persistent NBT
        run: python3 qa/neoforge/usgs_measured_global_hybrid_world_boot.py
      - name: Preserve actual generated world and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: USGS-Measured-Global-Hybrid-Real-World-Proof
          path: |
            neoforge/build/usgs-measured-hybrid-*.log
            neoforge/run/**/usgs-measured-hybrid-*/level.dat
            neoforge/run/**/usgs-measured-hybrid-*/region/*.mca
          if-no-files-found: warn
