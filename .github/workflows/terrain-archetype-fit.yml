name: Terrain archetype fit prototype

on:
  pull_request:
    paths:
      - "research/v1.1/**"
      - "docs/TERRAIN_ARCHETYPE_FITTING_V01.md"
      - ".github/workflows/terrain-archetype-fit.yml"
  push:
    branches: [main]
    paths:
      - "research/v1.1/**"
      - "docs/TERRAIN_ARCHETYPE_FITTING_V01.md"
      - ".github/workflows/terrain-archetype-fit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline calibration dependencies
        run: python -m pip install -r research/v1.1/requirements.txt
      - name: Run synthetic and GeoTIFF contract tests
        run: python -m unittest discover -s research/v1.1/tests -p "test_*.py" -v
