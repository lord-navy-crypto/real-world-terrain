name: Global rare landforms v3 - 24 geological shapes real server
on:
  pull_request:
    paths:
      - 'neoforge/**'
      - 'qa/neoforge/global_rare_landforms_v3_world_boot.py'
      - '.github/workflows/global-rare-landforms-v3-world.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regional-atlas-world:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build 12km global macro-regions and versioned 24-shape geography
        run: cd neoforge && gradle --no-daemon build
      - name: Boot actual regional atlas, verify all End spawn modes and persistent NBT
        run: python3 qa/neoforge/global_rare_landforms_v3_world_boot.py
      - name: Preserve actual generated world and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Global-Rare-Landforms-V3-Real-World-Proof
          path: |
            neoforge/build/global-rare-landform-v3-*.log
            neoforge/run/**/global-rare-landform-v3-*/level.dat
            neoforge/run/**/global-rare-landform-v3-*/region/*.mca
          if-no-files-found: warn
