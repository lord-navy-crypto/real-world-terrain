name: NeoForge dedicated server and saved-block verification
# Keep only the newest PR validation; old experimental commits must not
# monopolize expensive high-ceiling Minecraft server runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths: ['neoforge/**', 'qa/neoforge/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['neoforge/**', 'qa/neoforge/**', '.github/workflows/server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neoforge-worldgen:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare EULA and actual world type
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=world
          level-type=realscale:usgs_big_sur
          level-seed=785312
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          enable-rcon=true
          rcon.port=25575
          rcon.password=realscale_ci_probe_only
          PROPERTIES
          done
      - name: Start actual NeoForge server and generate the measured USGS center using authenticated RCON
        working-directory: neoforge
        run: python3 ../qa/neoforge/rcon_usgs_center_smoke.py .
      - name: Wait for saved region chunks before USGS height verification
        working-directory: neoforge
        run: |
          python3 - <<'PY'
          import pathlib,time
          deadline=time.monotonic()+90
          seen=0
          while True:
            seen=0
            for region in pathlib.Path('run').glob('**/region/r.*.*.mca'):
              parts=region.stem.split('.')
              if len(parts)!=3:
                continue
              rx,rz=int(parts[1]),int(parts[2])
              data=region.read_bytes()[:4096]
              for index in range(1024):
                if int.from_bytes(data[index*4:index*4+3], 'big') == 0:
                  continue
                cx=rx*32+(index%32)
                cz=rz*32+(index//32)
                if -4<=cx<=3 and -4<=cz<=3:
                  seen+=1
            # The audited DEM window is the same 8x8 chunk square. Thirty
            # persisted center chunks provide far more than the 30 height
            # samples required by check_actual_chunk_heights.py.
            if seen>=30:
              time.sleep(8)
              break
            if time.monotonic()>=deadline:
              raise SystemExit('Insufficient persisted DEM-center chunks: '+str(seen))
            time.sleep(4)
          print('REGION_FLUSH_READY:',seen,'persisted DEM-center chunks')
          PY
      - name: Verify ACTUAL Anvil block heights match USGS sampled terrain
        working-directory: neoforge
        run: python3 ../qa/neoforge/check_actual_chunk_heights.py .
      - name: Upload server diagnostics and generated world metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RealScale-FinalBattle-Actual-NeoForge-Server-QA
          path: |
            neoforge/real_dem_anvil_qa.json
            neoforge/build/neoforge-server-smoke.log
            neoforge/run/**/level.dat
            neoforge/run/**/region/*.mca
            neoforge/run/**/logs/latest.log
          if-no-files-found: warn
