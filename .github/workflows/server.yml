name: NeoForge dedicated server and saved-block verification
on:
  push:
    branches: [main]
    paths: ['neoforge/**', 'qa/neoforge/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['neoforge/**', 'qa/neoforge/**', '.github/workflows/server.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: realscale-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  neoforge-worldgen:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare EULA and actual world type
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<'PROPERTIES'
          level-name=world
          level-type=realscale:usgs_big_sur
          level-seed=785312
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          PROPERTIES
          done
      - name: Start actual NeoForge server; verify mod registry and new world
        working-directory: neoforge
        run: |
          python3 - <<'PY'
          import subprocess,threading,time,os,signal,json,pathlib,re
          log=pathlib.Path('build/neoforge-server-smoke.log')
          log.parent.mkdir(exist_ok=True,parents=True)
          p=subprocess.Popen(['gradle','--no-daemon','runServer','--stacktrace'],stdin=subprocess.PIPE,
                             stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1,
                             start_new_session=True)
          out=[];done=threading.Event()
          def reader():
            for line in p.stdout:
              out.append(line)
              if 'Done (' in line and 'For help' in line:done.set()
          t=threading.Thread(target=reader,daemon=True);t.start()
          deadline=time.time()+480
          while time.time()<deadline and p.poll() is None and not done.is_set():time.sleep(1)
          origin_verified=False
          if done.is_set():
            print('NEOFORGE_SERVER_BOOT_OK: reached Done milestone')
            p.stdin.write('forceload add 0 0\n')
            p.stdin.flush()
            import contextlib,io,sys
            sys.path.insert(0,str(pathlib.Path('../qa/neoforge').resolve()))
            import check_actual_chunk_heights
            limit=time.monotonic()+300
            while time.monotonic()<limit and p.poll() is None:
              p.stdin.write('save-all flush\n')
              p.stdin.flush()
              time.sleep(12)
              try:
                with contextlib.redirect_stdout(io.StringIO()):
                  check_actual_chunk_heights.scan(pathlib.Path('.'))
                origin_verified=True
                print('FORCED DEM CENTER VERIFIED: actual persisted block heights match USGS')
                break
              except (SystemExit,AssertionError,OSError,ValueError) as exc:
                print('DEM center still generating:',str(exc)[:180])
          else:
            print('NEOFORGE_SERVER_BOOT_FAIL:',p.poll())
          try:
            if p.poll() is None:
              p.stdin.write('stop\n');p.stdin.flush()
              p.wait(timeout=45)
          except Exception:
            if p.poll() is None:
              os.killpg(p.pid,signal.SIGINT)
              try:p.wait(timeout=15)
              except subprocess.TimeoutExpired:
                os.killpg(p.pid,signal.SIGKILL);p.wait()
          t.join(timeout=2)
          log.write_text(''.join(out))
          text=log.read_text()
          print('SERVER_LOG_TAIL:',text[-5500:])
          print('NeoForge Done marker:',done.is_set(),'lines:',len(out))
          files=list(pathlib.Path('run').glob('**/level.dat'))
          print('Level DAT candidates:',[str(x) for x in files])
          valid=False
          import gzip
          for f in files:
            try:
              data=gzip.decompress(f.read_bytes())
              if b'realscale:usgs_big_sur' in data:
                valid=True;print('Correct generator in saved level.dat:',f)
              else:print('WARNING generated other preset',f)
            except Exception as e:print('Could not read level.dat',f,e)
          if not done.is_set() or not valid or not origin_verified:
            raise SystemExit('NeoForge new-world smoke NOT VERIFIED')
          print('GAME ENGINE WORLDGEN SMOKE: PASS')
          PY
      - name: Verify ACTUAL Anvil block heights match USGS sampled terrain
        working-directory: neoforge
        run: python3 ../qa/neoforge/check_actual_chunk_heights.py .
      - name: Upload server diagnostics and generated world metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RealScale-FinalBattle-Actual-NeoForge-Server-QA
          path: |
            neoforge/real_dem_anvil_qa.json
            neoforge/build/neoforge-server-smoke.log
            neoforge/run/**/level.dat
            neoforge/run/**/region/*.mca
            neoforge/run/**/logs/latest.log
          if-no-files-found: warn
