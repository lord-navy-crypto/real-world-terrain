name: RealScale integrated TEST MAIN all-probes-on build + NeoForge boot
on:
  push:
    branches: [test/main-optimization-integration-20261022]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrated-test-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Verify source integrity, flags and saved-world comparators
        run: |
          python3 qa/verify_repository.py
          python3 -m unittest discover -s qa -p 'test_integrated_test_main.py' -v
          python3 -m unittest discover -s qa -p 'test_beardifier_anvil_semantics.py' -v
          python3 -m unittest discover -s qa -p 'test_beardifier_three_way_triage.py' -v
          python3 -m unittest discover -s qa -p 'test_beardifier_three_runs.py' -v
      - name: Execute all 3 pure-Java optional algorithm tests
        run: |
          mkdir -p build/test-main-smoke
          javac -d build/test-main-smoke \
            neoforge/src/main/java/org/realscale/neoforge/ClientChunkUploadBudget.java \
            neoforge/src/main/java/org/realscale/neoforge/AquiferReadOnlyStats.java \
            neoforge/src/main/java/org/realscale/neoforge/BeardifierYExtent.java \
            neoforge/src/test/java/org/realscale/neoforge/ClientChunkUploadBudgetSmoke.java \
            neoforge/src/test/java/org/realscale/neoforge/AquiferReadOnlyStatsSmoke.java \
            neoforge/src/test/java/org/realscale/neoforge/BeardifierYExtentSmoke.java
          java -cp build/test-main-smoke org.realscale.neoforge.ClientChunkUploadBudgetSmoke
          java -cp build/test-main-smoke org.realscale.neoforge.AquiferReadOnlyStatsSmoke
          java -cp build/test-main-smoke org.realscale.neoforge.BeardifierYExtentSmoke
      - name: Build complete NeoForge 1.21.1 installable test-version JAR
        working-directory: neoforge
        run: gradle --no-daemon --stacktrace build
      - name: Verify test JAR includes all and only accepted experiments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jars=list(Path("neoforge/build/libs").glob("*2.0.0-tva-preview.2-test.2.jar"))
          assert len(jars)==1,jars
          with ZipFile(jars[0]) as archive:
              names=set(archive.namelist())
              for expected in ("META-INF/neoforge.mods.toml",
                  "realscale.experimental.mixins.json",
                  "realscale.aquifer.audit.mixins.json",
                  "realscale.client.experiment.mixins.json",
                  "org/realscale/neoforge/BeardifierYExtent.class",
                  "org/realscale/neoforge/AquiferReadOnlyStats.class",
                  "org/realscale/neoforge/ClientChunkUploadBudget.class"):
                  assert expected in names,expected
              assert b"2.0.0-tva-preview.2-test.2" in archive.read("META-INF/neoforge.mods.toml")
              assert not any("PerlinExactMemoMixin.class" in x for x in names)
          print("REALSCALE_INTEGRATION_JAR_VALID",jars[0])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RealScale-Integrated-TEST-MAIN-NeoForge-1.21.1-JAR
          path: neoforge/build/libs/*2.0.0-tva-preview.2-test.2.jar
          if-no-files-found: error

  dedicated-worldgen-boot:
    needs: build-test-jar
    runs-on: ubuntu-latest
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: tva_measured_three_realms
            seed: 2
            mode: explicit-off-control
            flags: -Drealscale.experimental.beardifier.ycull=false -Drealscale.experimental.beardifier.verify=false -Drealscale.experimental.aquifer.audit=false -Drealscale.experimental.client.uploadbudget=false -Drealscale.client.fps.profile=false
          - preset: tva_sacred_timeline_three_realms
            seed: 42
            mode: explicit-off-control
            flags: -Drealscale.experimental.beardifier.ycull=false -Drealscale.experimental.beardifier.verify=false -Drealscale.experimental.aquifer.audit=false -Drealscale.experimental.client.uploadbudget=false -Drealscale.client.fps.profile=false
          - preset: tva_measured_three_realms
            seed: 2
            mode: all-on-default
            flags: ''
          - preset: tva_sacred_timeline_three_realms
            seed: 42
            mode: all-on-default
            flags: ''
    name: NeoForge TEST ${{ matrix.mode }} / ${{ matrix.preset }}
    env:
      JAVA_TOOL_OPTIONS: ${{ matrix.flags }}
      PRESET: ${{ matrix.preset }}
      SEED: ${{ matrix.seed }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Generate fully loaded remote 2096-height regions in virgin world
        working-directory: neoforge
        run: |
          for dir in run run/server run/gametestserver; do
            mkdir -p "$dir"
            printf 'eula=true\n' > "$dir/eula.txt"
            cat > "$dir/server.properties" <<PROPERTIES
          level-name=world
          level-type=realscale:$PRESET
          level-seed=$SEED
          generate-structures=true
          spawn-protection=0
          view-distance=3
          simulation-distance=3
          max-players=1
          max-tick-time=-1
          online-mode=true
          server-ip=127.0.0.1
          enable-rcon=true
          rcon.port=25575
          rcon.password=realscale_ci_probe_only
          PROPERTIES
          done
          python3 ../qa/neoforge/rcon_worldgen_smoke.py . "realscale:$PRESET" distant_route
      - name: Assert runtime mixin gating, exact original Beardifier zero replay
        run: |
          log=neoforge/build/rcon_distant_route_server.log
          if [ "$MODE" = 'explicit-off-control' ]; then
            grep -q 'REALSCALE_EXPERIMENT_BEARDIFIER_MIXIN_DECISION: .* enabled=false' "$log"
            grep -q 'REALSCALE_AQUIFER_READONLY_MIXIN_DECISION.*enabled=false' "$log"
            if grep -q 'REALSCALE_BEARDIFIER_DIRECT_PARITY_PASS' "$log"; then
              echo "Parity sampling still active despite explicit OFF" >&2; exit 1
            fi
          else
            grep -q 'REALSCALE_EXPERIMENT_BEARDIFIER_MIXIN_DECISION: .* enabled=true' "$log"
            grep -q 'REALSCALE_AQUIFER_READONLY_MIXIN_DECISION.*enabled=true' "$log"
            grep -q 'REALSCALE_BEARDIFIER_DIRECT_PARITY_PASS samples=[1-9]' "$log"
            # Prove that no JVM -D flag was supplied for this default-ON run.
            if grep -q 'realscale.experimental.beardifier.ycull=' "$log"; then
              echo "All-on-default path accidentally supplied an explicit Beardifier flag" >&2; exit 1
            fi
            grep -q 'REALSCALE_AQUIFER_READONLY_AUDIT calls=' "$log"
            grep -E 'REALSCALE_AQUIFER_READONLY_AUDIT calls=[1-9][0-9]*' "$log"
          fi
          if grep -q 'REALSCALE_CLIENT_UPLOAD_MIXIN_DECISION.*enabled=true' "$log"; then
            echo "Unexpected physical-client-only mixin on dedicated server" >&2; exit 1
          fi
          echo "REALSCALE_INTEGRATED_SERVER_PASS $PRESET $MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Integrated-Worldgen-${{ matrix.mode }}-${{ matrix.preset }}
          path: |
            neoforge/build/rcon_distant_route_timing.json
            neoforge/build/rcon_distant_route_server.log
          if-no-files-found: warn
