plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = '0.3.0-experimental'
group = 'org.realscale.compat'
base { archivesName = 'RealScale-DH-Chunky-Guard-NeoForge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.249'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        dhchunkyguard {
            sourceSet(sourceSets.main)
        }
    }
}
