plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version='1.2.0-continuity-experimental'
group='org.realscale'
base { archivesName = 'RealScaleTerrain-NeoForge-1.21.1-CONTINUITY-CAVES' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.249'
    runs {
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }
    mods {
        realscale {
            sourceSet(sourceSets.main)
        }
    }
}
