plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version='2.0.0-tva-preview.1'
group='org.realscale'
base { archivesName = 'RealScale-TVA-Ultimate-NeoForge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.249'
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }
    mods {
        realscale {
            sourceSet(sourceSets.main)
        }
    }
}
