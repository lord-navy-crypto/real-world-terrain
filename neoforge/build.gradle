plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version='2.0.0-preview.2-test.9'
group='org.realscale'
base { archivesName = 'RealScale-NeoForge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.249'
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }
    mods {
        realscale {
            sourceSet(sourceSets.main)
        }
    }
}


// Dedicated original v1.3 Terrain Lab dependencies. YACL is CLIENT-ONLY in
// metadata; the server must remain playable without any YACL installation.
// Lithostitched is used only when the player explicitly exports a Lab profile
// that contains its codecs, never by the legacy world-presets (including saved-world compatibility IDs).
repositories {
    // Use YACL's author-maintained Maven rather than a brittle Modrinth
    // short-ID/version artifact endpoint. This is the exact 1.21.1 NeoForge
    // build used by the Config GUI.
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
        content { includeGroup 'dev.isxander' }
    }
    // YACL uses Quilt's JSON/Gson parser artifacts. Make Quilt Maven the
    // exclusive source of this group: otherwise Gradle may probe NeoForged
    // Releases for the same module and fail on a needless TLS handshake.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Quilt Parsers Releases'
                url = 'https://maven.quiltmc.org/repository/release/'
            }
        }
        filter { includeGroup 'org.quiltmc.parsers' }
    }
    // TwelveMonkeys 3.12.0 and its parent/common POMs are on Maven Central.
    // Restrict this complete group tree to Maven Central, not NeoForged Maven.
    exclusiveContent {
        forRepository {
            mavenCentral()
        }
        filter { includeGroupByRegex 'com\\.twelvemonkeys(\\..*)?' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    implementation 'dev.isxander:yet-another-config-lib:3.8.1+1.21.1-neoforge' // YACL 3.8.1, official upstream Maven
    compileOnly 'maven.modrinth:XaDC71GB:sPmtDq1X' // OPTIONAL Terrain Lab-only codec: do not load global jigsaw redirect in baseline RealScale
    testImplementation(platform('org.junit:junit-bom:5.14.1'))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

// NeoForge ModDev supplies the mapped Minecraft/NeoForge compile classpath to
// the main source set. Reuse it for JUnit tests that directly exercise runtime
// density functions; Gradle's default test classpath otherwise cannot resolve
// net.minecraft classes during :compileTestJava.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// YACL stores 3 independent profiles. Converting one selected draft is an
// explicit export operation, never an automatic edit to the FOUR core presets.
// See scripts/export_terrain_lab_datapack.py.


// Embed every selectable structure preset inside the RealScale JAR itself.
// No external Python packages or structure ZIPs are required; the build uses the standard Python 3 runtime.
def generatedStructureResources = layout.buildDirectory.dir("generated/realscale-structure-packs")
def generatedLicensedArchitectureTemplates = layout.buildDirectory.dir("generated/realscale-licensed-architecture-templates")
def generatedOriginalArchitectureTemplates = layout.buildDirectory.dir("generated/realscale-original-architecture-templates")
def generatedBatchArchitectureTemplates = layout.buildDirectory.dir("generated/realscale-batch-architecture-templates")
def generatedExpansionArchitectureTemplates = layout.buildDirectory.dir("generated/realscale-expansion-architecture-templates")

// Gradle 9 removed Project.exec. Use ProviderFactory.exec so these
// deterministic resource generators work on both the Gradle 8 and 9 CI lanes.
def runArchitecturePython = { String scriptPath, List<String> arguments ->
    def command = [System.getenv("PYTHON") ?: "python3", file(scriptPath).absolutePath] + arguments
    providers.exec {
        commandLine(command)
    }.result.get()
}

// Convert only the three explicitly licensed GDMC source schematics. The source
// files stay outside the NeoForge module and are never packaged in the JAR.
tasks.register("generateArchitectureTemplates") {
    inputs.dir(file("../assets/architecture/gdmc-source"))
    inputs.file(file("../scripts/convert_gdmc_architecture.py"))
    outputs.dir(generatedLicensedArchitectureTemplates)
    doLast {
        def output = generatedLicensedArchitectureTemplates.get().asFile
        project.delete(output)
        runArchitecturePython("../scripts/convert_gdmc_architecture.py", [
            "--source", file("../assets/architecture/gdmc-source").absolutePath,
            "--output", output.absolutePath
        ])
    }
}

tasks.register("generateOriginalArchitectureTemplates") {
    inputs.file(file("../scripts/generate_original_architecture.py"))
    outputs.dir(generatedOriginalArchitectureTemplates)
    doLast {
        def output = generatedOriginalArchitectureTemplates.get().asFile
        project.delete(output)
        runArchitecturePython("../scripts/generate_original_architecture.py", [
            "--output", output.absolutePath
        ])
    }
}

tasks.register("generateArchitectureBatchTemplates") {
    inputs.file(file("../scripts/generate_architecture_batch.py"))
    inputs.file(file("../scripts/generate_original_architecture.py"))
    outputs.dir(generatedBatchArchitectureTemplates)
    doLast {
        def output = generatedBatchArchitectureTemplates.get().asFile
        project.delete(output)
        runArchitecturePython("../scripts/generate_architecture_batch.py", [
            "--output", output.absolutePath
        ])
    }
}

tasks.register("generateArchitectureExpansionTemplates") {
    inputs.file(file("../scripts/generate_architecture_expansion.py"))
    inputs.file(file("../scripts/generate_original_architecture.py"))
    outputs.dir(generatedExpansionArchitectureTemplates)
    doLast {
        def output = generatedExpansionArchitectureTemplates.get().asFile
        project.delete(output)
        runArchitecturePython("../scripts/generate_architecture_expansion.py", [
            "--output", output.absolutePath
        ])
    }
}

tasks.register("generateBuiltInStructurePacks") {
