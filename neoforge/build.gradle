            [id:"riverside_sawmill", spacing:896, separation:256, salt:140078, biomes:["minecraft:river", "minecraft:forest", "minecraft:taiga", "realscale:riverine_woodland", "realscale:floodplain_margin", "realscale:wet_meadow", "realscale:seasonal_floodforest"]],
            [id:"marsh_reed_hamlet", spacing:896, separation:256, salt:140079, biomes:["minecraft:swamp", "minecraft:mangrove_swamp", "minecraft:river", "realscale:wet_meadow", "realscale:marshy_woodland", "realscale:reed_marsh_edge", "realscale:seasonal_floodforest"]],
        ]

        // The 42-template expansion is maintained as a JSON manifest so the
        // density budget can be audited independently from the NBT generator.
        def expansionProfiles = new groovy.json.JsonSlurper().parse(
                file("../scripts/architecture_expansion_profiles.json"))
        architectureProfiles.addAll(expansionProfiles)

        architectureProfiles.each { profile ->
            def id = profile.id
            def poolId = "realscale:architecture/" + id
            def structureId = "realscale:" + id

            writeArchitectureJson("data/realscale/worldgen/structure/" + id + ".json", [
                type:"minecraft:jigsaw",
                biomes:"#realscale:has_structure/" + id,
                step:"surface_structures",
                spawn_overrides:[:],
                terrain_adaptation:"none",
                start_pool:poolId,
                size:0,
                start_height:[absolute:0],
                project_start_to_heightmap:"WORLD_SURFACE_WG",
                max_distance_from_center:80,
                use_expansion_hack:false,
                liquid_settings:"ignore_waterlogging"
            ])

            writeArchitectureJson("data/realscale/worldgen/template_pool/architecture/" + id + ".json", [
                fallback:"minecraft:empty",
                elements:[[
                    weight:1,
                    element:[
                        element_type:"minecraft:single_pool_element",
                        location:poolId,
                        processors:"minecraft:empty",
                        projection:"rigid"
                    ]
                ]]
            ])

            writeArchitectureJson("data/realscale/worldgen/structure_set/" + id + ".json", [
                structures:[[structure:structureId, weight:1]],
                placement:[
                    type:"minecraft:random_spread",
                    salt:profile.salt,
                    separation:profile.separation,
                    spacing:profile.spacing,
                    spread_type:"linear"
                ]
            ])

            writeArchitectureJson("data/realscale/tags/worldgen/biome/has_structure/" + id + ".json", [
                replace:false,
                values:profile.biomes
            ])
        }
    }
}
