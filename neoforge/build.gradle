plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version='2.0.0-tva-preview.1'
group='org.realscale'
base { archivesName = 'RealScale-TVA-Ultimate-NeoForge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.249'
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }
    mods {
        realscale {
            sourceSet(sourceSets.main)
        }
    }
}


// Dedicated original v1.3 Terrain Lab dependencies. YACL is CLIENT-ONLY in
// metadata; the server must remain playable without any YACL installation.
// Lithostitched is used only when the player explicitly exports a Lab profile
// that contains its codecs, never by the canonical TVA world presets.
repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    implementation 'maven.modrinth:1eAoo2KR:h8Px82QV' // YACL 3.8.1
    implementation 'maven.modrinth:XaDC71GB:u0UUKAE1' // Lithostitched 1.6.0
    testImplementation(platform('org.junit:junit-bom:5.14.1'))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

// YACL stores 3 independent profiles. Converting one selected draft is an
// explicit export operation, never an automatic edit to the FOUR core presets.
// See scripts/export_terrain_lab_datapack.py.
