plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version='1.4.1-terrain-lab-yacl-experimental'
group='org.realscale'
base { archivesName = 'RealScaleTerrain-NeoForge-1.21.1-ALL-PRESETS-SMOOTH-CAVES' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.249'
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }
    mods {
        realscale {
            sourceSet(sourceSets.main)
        }
    }
}

 
// The legacy RealDemTileSmoke.main() is also compiled standalone by
// qa/verify_repository.py. Keep that original SHA-pinned test source intact.
// This additional JUnit wrapper makes Gradle 9.x run REAL tests instead of
// treating the presence of unannotated test classes as an error.
repositories {
    // Official Modrinth artifact for YACL 3.8.1+1.21.1-neoforge.
    // Do not jar-in-jar YACL; the loader discovers it as a client mod.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation 'maven.modrinth:1eAoo2KR:h8Px82QV'
    testImplementation(platform('org.junit:junit-bom:5.14.1'))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// YACL edits a DRAFT for the next new world; it cannot mutate loaded registries.
// Bake the saved draft into a uniquely keyed world preset before processResources.
// Never writes or deletes worlds in run/saves.
tasks.register('prepareTerrainLabDraft', Exec) {
    workingDir project.rootDir.parentFile
    commandLine 'python3', 'scripts/terrain_lab.py',
        '--from-yacl', 'neoforge/run/config/realscale-terrain-lab.json'
    onlyIf {
        file('run/config/realscale-terrain-lab.json').isFile()
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('prepareTerrainLabDraft')
}
