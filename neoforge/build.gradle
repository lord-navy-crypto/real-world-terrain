            [id:"railway_depot", spacing:896, separation:256, salt:140076, biomes:["minecraft:plains", "minecraft:meadow", "minecraft:forest", "realscale:forest_steppe", "realscale:riverine_woodland", "realscale:woodland_meadow"]],
