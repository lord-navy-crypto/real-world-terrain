plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version='2.0.0-tva-preview.1'
group='org.realscale'
base { archivesName = 'RealScale-TVA-Ultimate-NeoForge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.249'
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }
    mods {
        realscale {
            sourceSet(sourceSets.main)
        }
    }
}


// Dedicated original v1.3 Terrain Lab dependencies. YACL is CLIENT-ONLY in
// metadata; the server must remain playable without any YACL installation.
// Lithostitched is used only when the player explicitly exports a Lab profile
// that contains its codecs, never by the canonical TVA world presets.
repositories {
    // Use YACL's author-maintained Maven rather than a brittle Modrinth
    // short-ID/version artifact endpoint. This is the exact 1.21.1 NeoForge
    // build used by the Config GUI.
    maven {
        name = 'Xander Maven'
        url = 'https://maven.isxander.dev/releases'
        content { includeGroup 'dev.isxander' }
    }
    // YACL uses Quilt's JSON/Gson parser artifacts. Make Quilt Maven the
    // exclusive source of this group: otherwise Gradle may probe NeoForged
    // Releases for the same module and fail on a needless TLS handshake.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Quilt Parsers Releases'
                url = 'https://maven.quiltmc.org/repository/release/'
            }
        }
        filter { includeGroup 'org.quiltmc.parsers' }
    }
    // TwelveMonkeys 3.12.0 and its parent/common POMs are on Maven Central.
    // Restrict this complete group tree to Maven Central, not NeoForged Maven.
    exclusiveContent {
        forRepository {
            mavenCentral()
        }
        filter { includeGroupByRegex 'com\\.twelvemonkeys(\\..*)?' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    implementation 'dev.isxander:yet-another-config-lib:3.8.1+1.21.1-neoforge' // YACL 3.8.1, official upstream Maven
    compileOnly 'maven.modrinth:XaDC71GB:sPmtDq1X' // OPTIONAL Terrain Lab-only codec: do not load global jigsaw redirect in baseline RealScale
    testImplementation(platform('org.junit:junit-bom:5.14.1'))
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

// YACL stores 3 independent profiles. Converting one selected draft is an
// explicit export operation, never an automatic edit to the FOUR core presets.
// See scripts/export_terrain_lab_datapack.py.


// Embed every selectable structure preset inside the RealScale JAR itself.
// No Python or external structure ZIPs are needed to play or build the mod.
def generatedStructureResources = layout.buildDirectory.dir("generated/realscale-structure-packs")
def generatedArchitectureTemplates = layout.buildDirectory.dir("generated/realscale-architecture-templates")

// Convert only the three explicitly licensed GDMC source schematics. The source
// files stay outside the NeoForge module and are never packaged in the JAR.
tasks.register("generateArchitectureTemplates") {
    inputs.dir(file("../assets/architecture/gdmc-source"))
    inputs.file(file("../scripts/convert_gdmc_architecture.py"))
    outputs.dir(generatedArchitectureTemplates)
    doLast {
        def output = generatedArchitectureTemplates.get().asFile
        project.delete(output)
        def python = System.getenv("PYTHON") ?: "python3"
        exec {
            commandLine python,
                    file("../scripts/convert_gdmc_architecture.py").absolutePath,
                    "--source", file("../assets/architecture/gdmc-source").absolutePath,
                    "--output", output.absolutePath
        }
    }
}

tasks.register("generateBuiltInStructurePacks") {
    dependsOn("generateArchitectureTemplates")
    outputs.dir(generatedStructureResources)
    doLast {
        def root = generatedStructureResources.get().asFile
        project.delete(root)

        // Exact Minecraft 1.21.1 structure-set placement baselines.
        // Keep in sync with scripts/make_structure_density_packs.py; CI compares
        // all generated resources to that independently tested implementation.
        def overworld = [
            ancient_cities: [24, 8, 20083232, [ancient_city:1]],
            desert_pyramids: [32, 8, 14357617, [desert_pyramid:1]],
            igloos: [32, 8, 14357618, [igloo:1]],
            jungle_temples: [32, 8, 14357619, [jungle_pyramid:1]],
            ocean_monuments: [32, 5, 10387313, [monument:1]],
            ocean_ruins: [20, 8, 14357621, [ocean_ruin_cold:1, ocean_ruin_warm:1]],
            shipwrecks: [24, 4, 165745295, [shipwreck:1, shipwreck_beached:1]],
            swamp_huts: [32, 8, 14357620, [swamp_hut:1]],
            trail_ruins: [34, 8, 83469867, [trail_ruins:1]],
            trial_chambers: [34, 12, 94251327, [trial_chambers:1]],
            villages: [34, 8, 10387312, [village_plains:1, village_desert:1,
                                         village_savanna:1, village_snowy:1, village_taiga:1]],
            woodland_mansions: [80, 20, 10387319, [mansion:1]]
        ]
        def realms = [
            nether_complexes: [27, 4, 30084232, [fortress:2, bastion_remnant:3]],
            end_cities: [20, 11, 10387313, [end_city:1]]
        ]
        def definitions = []
        [2,3,4,6].each { ratio -> definitions.add(["overworld_" + ratio, ratio, overworld]) }
        [2,3].each { ratio -> definitions.add(["dimensions_" + ratio, ratio, realms]) }

        definitions.each { definition ->
            def (id, ratio, catalog) = definition
            def target = new File(root, "resourcepacks/realscale_structures_" + id)
            target.mkdirs()
            new File(target, "pack.mcmeta").setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    pack:[pack_format:48, description:
                        "RealScale built-in optional structures " + id + " — candidate density only"]
                ])) + "\n", "UTF-8")

            catalog.each { name, values ->
                def (spacing, separation, salt, structures) = values
                def newSpacing = Math.max((int)separation + 2,
                        (int)Math.round(((double)spacing) / Math.sqrt((double)ratio)))
                def placement = [type:"minecraft:random_spread", salt:salt,
                                 separation:separation, spacing:newSpacing]
                if (name in ["ocean_monuments", "woodland_mansions", "end_cities"])
                    placement.spread_type = "triangular"
                def data = [
                    placement:placement,
                    structures:structures.collect { key, weight ->
                        [structure:"minecraft:" + key, weight:weight]
                    }
                ]
                def file = new File(target,
                        "data/minecraft/worldgen/structure_set/" + name + ".json")
                file.parentFile.mkdirs()
                file.setText(groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(data)) + "\n", "UTF-8")
            }
        }

        // Separate, non-mandatory architecture pack: three converted NBT templates
        // plus biome-aware single-piece jigsaw structure definitions.
        def architecturePack = new File(root, "resourcepacks/realscale_structures_architecture_pilot")
        architecturePack.mkdirs()
        new File(architecturePack, "pack.mcmeta").setText(
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                pack:[pack_format:48,
                      description:"RealScale optional architecture pilot — Apache-2.0 GDMC-derived templates"]
            ])) + "\n", "UTF-8")

        def templateSource = new File(generatedArchitectureTemplates.get().asFile,
                "data/realscale/structures/architecture")
        if (!templateSource.isDirectory())
            throw new GradleException("Converted architecture templates are missing: " + templateSource)
        project.copy {
            from(templateSource)
            into(new File(architecturePack, "data/realscale/structures/architecture"))
        }

        def writeArchitectureJson = { String relativePath, Object value ->
            def target = new File(architecturePack, relativePath)
            target.parentFile.mkdirs()
            target.setText(groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(value)) + "\n", "UTF-8")
        }

        def architectureProfiles = [
            [id:"modern_house", spacing:48, separation:16, salt:140011,
             biomes:["#minecraft:is_plains", "#minecraft:is_forest",
                     "#minecraft:is_savanna", "#minecraft:is_taiga"]],
            [id:"glass_greenhouse", spacing:72, separation:24, salt:140012,
             biomes:["#minecraft:is_plains", "#minecraft:is_forest",
                     "#minecraft:is_savanna"]],
            [id:"city_library", spacing:112, separation:32, salt:140013,
             biomes:["#minecraft:is_plains", "#minecraft:is_forest",
                     "#minecraft:is_taiga"]]
        ]

        architectureProfiles.each { profile ->
            def id = profile.id
            def poolId = "realscale:architecture/" + id
            def structureId = "realscale:" + id

            writeArchitectureJson("data/realscale/worldgen/structure/" + id + ".json", [
                type:"minecraft:jigsaw",
                biomes:"#realscale:has_structure/" + id,
                step:"surface_structures",
                terrain_adaptation:"none",
                start_pool:poolId,
                size:0,
                start_height:[absolute:0],
                project_start_to_heightmap:"WORLD_SURFACE_WG",
                max_distance_from_center:80,
                use_expansion_hack:false,
                liquid_settings:"ignore_waterlogging"
            ])

            writeArchitectureJson("data/realscale/worldgen/template_pool/architecture/" + id + ".json", [
                fallback:"minecraft:empty",
                elements:[[
                    weight:1,
                    element:[
                        element_type:"minecraft:single_pool_element",
                        location:poolId,
                        processors:"minecraft:empty",
                        projection:"rigid"
                    ]
                ]]
            ])

            writeArchitectureJson("data/realscale/worldgen/structure_set/" + id + ".json", [
                structures:[[structure:structureId, weight:1]],
                placement:[
                    type:"minecraft:random_spread",
                    salt:profile.salt,
                    separation:profile.separation,
                    spacing:profile.spacing,
                    spread_type:"linear"
                ]
            ])

            writeArchitectureJson("data/realscale/tags/worldgen/biome/has_structure/" + id + ".json", [
                replace:false,
                values:profile.biomes
            ])
        }
    }
}
sourceSets.main.resources.srcDir(generatedStructureResources)
tasks.named("processResources") {
    dependsOn("generateBuiltInStructurePacks")
}
